const MONTH_WORDS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function periodToMonthKey(period) {
  if (!period) return null;
  const s = String(period).toLowerCase();
  // Try "1st may - 31st may 2026" / "01 jan 2026" (month word + 4-digit year)
  let best = null;
  const re = /([a-z]{3,9})[a-z]*\s*[^0-9]{0,6}(\d{4})/g; let m;
  while ((m = re.exec(s))) { const mo = MONTH_WORDS[m[1].slice(0, 3)]; if (mo) best = monthKey(+m[2], mo); }
  if (best) return best;
  // Try numeric "01-05-2026" or "01/05/2026" (dd-mm-yyyy)
  const n = s.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/);
  if (n) { const mo = +n[2]; if (mo >= 1 && mo <= 12) return monthKey(+n[3], mo); }
  // Try "2026-05"
  const iso = s.match(/\b(\d{4})[\/\-.](\d{1,2})\b/);
  if (iso) { const mo = +iso[2]; if (mo >= 1 && mo <= 12) return monthKey(+iso[1], mo); }
  return null;
}

    return common + ` This is an Etisalat (e&) tax invoice. JSON shape:
{"accountNumber":"","invoiceNumber":"","invoicePeriod":"","basicRental":0,"vat":0,"total":0,"otherCredits":0,"extraUsages":[{"description":"","amount":0,"category":"Local calls & SMS"|"Staff chargeable"}]}

{"accountNumber":"","invoiceNumber":"","invoicePeriod":"","basicRental":0,"vat":0,"total":0}
CRITICAL field mapping for DU:
- accountNumber = the "Service ID" — the mobile number shown in the "Charges summary by services" / service details (e.g. 0582192470, a 10-digit number starting with 05). Use the Service ID, NOT "Your account number" and NOT the bill number. If several service lines exist, use the first Service ID.
- invoiceNumber = the value labelled "Your bill number" (e.g. 0187857964).
- invoicePeriod = the "Your bill cycle" range (e.g. 1st May - 31st May 2026).
- basicRental = "Subtotal of taxable services" (the total charges BEFORE VAT).
- vat = the "VAT at 5%" / "VAT (5%)" amount.

function TrendChart({ data, cur, accent = "#3355D8" }) {
  const [type, setType] = useState("area");
  if (!data || !data.length) return <Empty />;
  const max = Math.max(...data.map((d) => d.value), 1);
  const n = data.length;
  const W = Math.max(n * 64, 340), H = 210, padB = 28, padT = 18, padX = 14;
  const plotH = H - padB - padT, plotW = W - padX * 2;
  const X = (i) => padX + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const Y = (v) => padT + plotH - (v / max) * plotH;
  const pts = data.map((d, i) => [X(i), Y(d.value)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[n - 1][0].toFixed(1)} ${padT + plotH} L${pts[0][0].toFixed(1)} ${padT + plotH} Z`;
  const selector = (
    <div style={{ border: `1px solid ${T.line}`, background: "#fff" }} className="flex rounded-lg overflow-hidden text-[11px]">
      {[["area", "Area"], ["line", "Line"], ["column", "Columns"]].map(([v, l]) => (
        <button key={v} onClick={() => setType(v)} style={{ background: type === v ? T.teal : "#fff", color: type === v ? "#fff" : T.sub }} className="px-2.5 py-1">{l}</button>
      ))}
    </div>
  );
  const grid = [0.25, 0.5, 0.75, 1].map((f, i) => <line key={i} x1={padX} x2={W - padX} y1={padT + plotH - f * plotH} y2={padT + plotH - f * plotH} stroke={T.line} strokeWidth="1" strokeDasharray="3 4" />);
  const labels = data.map((d, i) => <text key={i} x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill={T.sub}>{d.label}</text>);
  const dots = pts.map((p, i) => <g key={i} className="pop-in" style={{ animationDelay: `${600 + i * 60}ms` }}><circle cx={p[0]} cy={p[1]} r="4.5" fill="#fff" stroke={accent} strokeWidth="2.5" /></g>);
  let body;
  if (type === "column") {
    const bw = Math.min(34, plotW / n - 10);
    body = data.map((d, i) => { const h = (d.value / max) * plotH; const x = X(i) - bw / 2; const y = padT + plotH - h; return (
      <g key={i}><rect className="grow-col" style={{ animationDelay: `${i * 70}ms` }} x={x} y={y} width={bw} height={h} rx="6" fill="url(#tgrad)" filter="url(#fbev)" />
        <text x={X(i)} y={y - 5} textAnchor="middle" fontSize="9" fontWeight="800" fill={T.ink}>{Math.round(d.value).toLocaleString()}</text></g>
    ); });
  } else {
    body = <React.Fragment>
      {type === "area" && <path d={area} fill="url(#tarea)" className="fade-rise" />}
      <path d={line} fill="none" stroke={accent} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="draw-line" filter="url(#fbev)" />
      {dots}
    </React.Fragment>;
  }
  return (
    <div>
      <div className="flex justify-end mb-3">{selector}</div>
      <div className="overflow-x-auto"><svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxHeight: 240, minWidth: Math.min(W, 460) }}>
        <defs>
          <linearGradient id="tarea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={accent} stopOpacity="0.35" /><stop offset="1" stopColor={accent} stopOpacity="0.02" /></linearGradient>
          <linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={lighten(accent, 22)} /><stop offset="1" stopColor={accent} /></linearGradient>
        </defs>
        {grid}{body}{labels}
      </svg></div>
    </div>
  );
}

function App({ supabase, session, onLogout }) {
  const [tab, setTab] = useState("dashboard");
  const [themeId, setThemeId] = useState(() => { try { return localStorage.getItem("tem:theme") || "default"; } catch { return "default"; } });
  applyThemeToT(themeId);
  const pickTheme = (id) => { applyThemeToT(id); setThemeId(id); try { localStorage.setItem("tem:theme", id); } catch {} };
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [connections, setConnections] = useState([]);
  const [bills, setBills] = useState([]);
  const [receipts, setReceipts] = useState([]);
  const [settings, setSettings] = useState({ ...DEFAULT_SETTINGS, ...readLocalKeys() });
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState(null);
  const lastSync = useRef(new Date(0).toISOString());
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  // Load the shared workspace from Supabase, then subscribe to live changes
  useEffect(() => {
    let channel;
    (async () => {
      try {
        let { data } = await supabase.from("workspace").select("*").eq("id", "main").maybeSingle();
        if (!data) {
          await supabase.from("workspace").insert({ id: "main", connections: [], bills: [], settings: DEFAULT_SETTINGS });
          data = { connections: [], bills: [], settings: DEFAULT_SETTINGS };
        }
        setConnections(data.connections || []);
        setBills(data.bills || []);
        setReceipts(data.receipts || []);
        lastSync.current = data.updated_at || new Date(0).toISOString();
        setSettings({ ...DEFAULT_SETTINGS, ...(data.settings || {}), ...readLocalKeys() });
      } catch (e) { console.error(e); flash("Could not load data — check your connection"); }
      setLoaded(true);
      channel = supabase.channel("ws")
        .on("postgres_changes", { event: "*", schema: "public", table: "workspace", filter: "id=eq.main" }, (p) => {
          const r = p.new; if (!r) return;
          // Ignore our own echo and any out-of-order/stale broadcast — only apply strictly newer states
          if (r.updated_at && lastSync.current && r.updated_at <= lastSync.current) return;
          lastSync.current = r.updated_at || lastSync.current;
          setConnections(r.connections || []);
          setBills(r.bills || []);
          setReceipts(r.receipts || []);
          setSettings({ ...DEFAULT_SETTINGS, ...(r.settings || {}), ...readLocalKeys() });
        }).subscribe();
    })();
    return () => { if (channel) supabase.removeChannel(channel); };
  }, []);

  const persist = async (patch) => {
    setSaving(true);
    const ts = new Date().toISOString();
    lastSync.current = ts;
    try { const { error } = await supabase.from("workspace").update({ ...patch, updated_at: ts }).eq("id", "main"); if (error) throw error; }
    catch (e) { console.error(e); flash("⚠ Save failed — check your connection and try again"); }
    finally { setSaving(false); }
  };
  const reload = async () => {
    try {
      const { data } = await supabase.from("workspace").select("*").eq("id", "main").maybeSingle();
      if (data) {
        setConnections(data.connections || []); setBills(data.bills || []); setReceipts(data.receipts || []);
        lastSync.current = data.updated_at || lastSync.current;
        flash("Refreshed");
      }
    } catch (e) { console.error(e); flash("Refresh failed"); }
  };
  const logActivity = async (action, detail) => {
    try { await supabase.from("activity_log").insert({ user_email: session?.user?.email || "unknown", action, detail }); } catch (e) { console.error("log failed", e); }
  };
  const saveConn = (next) => {
    const prev = connections;
    setConnections(next); persist({ connections: next });
    const pIds = new Set(prev.map((c) => c.id)), nIds = new Set(next.map((c) => c.id));
    const pMap = Object.fromEntries(prev.map((c) => [c.id, c]));
    const added = next.filter((c) => !pIds.has(c.id)).length;
    const removed = prev.filter((c) => !nIds.has(c.id)).length;
    const edited = next.filter((c) => pIds.has(c.id) && JSON.stringify(c) !== JSON.stringify(pMap[c.id])).length;
    const parts = []; if (added) parts.push(`added ${added}`); if (edited) parts.push(`edited ${edited}`); if (removed) parts.push(`removed ${removed}`);
    if (parts.length) logActivity("Connections", parts.join(", ") + ` connection(s)`);
  };
  const saveBills = (next) => {
    const prev = bills;
    setBills(next); persist({ bills: next });
    const pMap = Object.fromEntries(prev.map((b) => [b.id, b])), nMap = Object.fromEntries(next.map((b) => [b.id, b]));
    const added = next.filter((b) => !pMap[b.id]).length;
    const removed = prev.filter((b) => !nMap[b.id]).length;
    let analysed = 0, approved = 0, unapproved = 0, edited = 0;
    next.forEach((b) => { const o = pMap[b.id]; if (!o) return;
      if (!o.analysed && b.analysed) analysed++;
      else if (!o.approved && b.approved) approved++;
      else if (o.approved && !b.approved) unapproved++;
      else if (JSON.stringify(o) !== JSON.stringify(b)) edited++; });
    const parts = [];
    if (added) parts.push(`uploaded ${added}`); if (analysed) parts.push(`analysed ${analysed}`);
    if (approved) parts.push(`approved ${approved}`); if (unapproved) parts.push(`unapproved ${unapproved}`);
    if (edited) parts.push(`edited ${edited}`); if (removed) parts.push(`deleted ${removed}`);
    if (parts.length) logActivity("Bills", parts.join(", ") + ` bill(s)`);
  };
  const saveReceipts = (next) => {
    const prev = receipts;
    setReceipts(next); persist({ receipts: next });
    const pMap = Object.fromEntries(prev.map((r) => [r.id, r])), nMap = Object.fromEntries(next.map((r) => [r.id, r]));
    const added = next.filter((r) => !pMap[r.id]).length;
    const removed = prev.filter((r) => !nMap[r.id]).length;
    const edited = next.filter((r) => pMap[r.id] && JSON.stringify(r) !== JSON.stringify(pMap[r.id])).length;
    const parts = []; if (added) parts.push(`added ${added}`); if (edited) parts.push(`edited ${edited}`); if (removed) parts.push(`removed ${removed}`);
    if (parts.length) logActivity("Payments", parts.join(", ") + ` receipt(s)`);
  };
  const saveSettings = (next) => {
    setSettings(next);
    const { apiKey, model, ...shared } = next;
    try { localStorage.setItem(LOCAL_KEYS, JSON.stringify({ apiKey, model })); } catch {}
    persist({ settings: shared });
    logActivity("Settings", "updated workspace settings");
  };
  const approxBytes = useMemo(() => { try { return new Blob([JSON.stringify({ connections, bills, settings })]).size; } catch { return 0; } }, [connections, bills, settings]);
  const exportData = () => {
    const payload = { app: "telecom-ledger", version: 1, exportedAt: new Date().toISOString(), connections, bills, receipts, settings };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `telecom-ledger-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    flash("Backup exported");
  };
  const restoreData = async (obj) => {
    if (!obj || (!Array.isArray(obj.connections) && !Array.isArray(obj.bills))) { alert("This doesn't look like a valid backup file."); return; }
    const c = obj.connections || [], b = obj.bills || [], rc = obj.receipts || [];
    if (!confirm("Restore this backup? Files will be uploaded to cloud storage and this REPLACES the shared data for ALL users.")) return;
    flash("Restoring & uploading files to cloud… please wait");
    const migrate = async (arr) => {
      for (const x of arr) {
        if (x && x.base64 && !x.storagePath) {
          try { x.storagePath = await uploadToStorage(x.id, x.base64, x.fileType); } catch (e) { console.error("migrate failed", e); }
          delete x.base64;
        }
      }
      return arr;
    };
    await migrate(b); await migrate(rc);
    setConnections(c); setBills(b); setReceipts(rc);
    const patch = { connections: c, bills: b, receipts: rc };
    if (obj.settings) { const { apiKey, model, ...shared } = obj.settings; setSettings({ ...settings, ...obj.settings }); patch.settings = shared; }
    await persist(patch);
    logActivity("Backup", `restored (${c.length} connections, ${b.length} bills, ${rc.length} receipts)`);
    flash("Backup restored to cloud ✓");
  };
  const addConnection = (form) => {
    const c = { ...form, id: uid(), sn: nextSN(connections), status: form.status || "active", createdAt: Date.now() };
    saveConn([...connections, c]);
  };
  const unidentifiedCount = findUnidentified(bills, connections).size;
  const reviewCount = useMemo(() => {
    const d = new Date(); d.setMonth(d.getMonth() - 3);
    const cutoff = monthKey(d.getFullYear(), d.getMonth() + 1);
    const sixAgo = Date.now() - 182 * 864e5;
    const lastByAcc = {};
    bills.forEach((b) => { const a = normAcc(b.accountNumber); if (!a) return; const mk = b.monthKey || ""; if (!lastByAcc[a] || mk > lastByAcc[a]) lastByAcc[a] = mk; });
    return connections.filter((c) => {
      if ((c.status || "active") !== "active") return false;
      const a = normAcc(c.accountNumber); if (!a) return false;
      const last = lastByAcc[a] || "";
      if (last && last >= cutoff) return false;
      if (c.dormantReviewedAt && new Date(c.dormantReviewedAt).getTime() > sixAgo) return false;
      return true;
    }).length;
  }, [connections, bills]);

  const nav = [
    { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { id: "connections", label: "Connections", icon: Network },
    { id: "upload", label: "Bill Upload", icon: Upload },
    { id: "analysis", label: "Analysis & Allocation", icon: FileSearch },
    { id: "monthly", label: "Monthly Verify", icon: CalendarDays },
    { id: "reports", label: "Reports", icon: FileBarChart },
    { id: "payments", label: "Payments", icon: Receipt },
    { id: "review", label: "Review", icon: Review },
    { id: "search", label: "Search", icon: Search },
    { id: "activity", label: "Activity Log", icon: History },
    { id: "themes", label: "Color Themes", icon: Palette },
  ];

  if (!loaded) {
    return (
      <div style={{ background: T.paper, color: T.sub }} className="min-h-screen flex items-center justify-center gap-2">
        <Loader2 size={20} className="animate-spin" /> Loading shared workspace…
      </div>
    );
  }

  return (
    <div style={{ background: T.paper, color: T.text }} className="min-h-screen flex text-sm">

/* ============================== SHARED UI ============================== */
function PageHeader({ title, subtitle, children }) {
  return (
    <div style={{ borderBottom: `1px solid ${T.line}`, background: T.card }} className="px-8 py-5 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 className="text-lg font-semibold" dangerouslySetInnerHTML={{ __html: title }} />
        {subtitle && <p style={{ color: T.sub }} className="text-xs mt-0.5" dangerouslySetInnerHTML={{ __html: subtitle }} />}
      </div>
      <div className="flex items-center gap-2 flex-wrap justify-end">{children}</div>
    </div>
  );
}
function Card({ children, className = "", style = {} }) {
  return <div style={{ background: T.card, border: `1px solid ${T.line}`, ...style }} className={`rounded-xl ${className}`}>{children}</div>;
}
function Btn({ children, onClick, variant = "primary", size = "md", type = "button", disabled }) {
  const base = "inline-flex items-center gap-1.5 font-medium rounded-lg disabled:opacity-50";
  const sizes = { sm: "px-2.5 py-1.5 text-xs", md: "px-3.5 py-2 text-[13px]" };
  const styles = {
    primary: { background: T.teal, color: "#fff" }, dark: { background: T.ink, color: "#fff" },
    amber: { background: T.amber, color: "#fff" }, ghost: { background: "transparent", color: T.sub, border: `1px solid ${T.line}` },
    danger: { background: "transparent", color: T.red, border: `1px solid ${T.red}` },
  };
  return <button type={type} onClick={onClick} disabled={disabled} style={styles[variant]} className={`${base} ${sizes[size]}`}>{children}</button>;
}
function Field({ label, children, hint }) {
  return (
    <label className="block">
      <span style={{ color: T.sub }} className="text-xs font-medium">{label}</span>
      <div className="mt-1">{children}</div>
      {hint && <span style={{ color: T.sub }} className="text-[11px]">{hint}</span>}
    </label>
  );
}
const inputCls = "w-full px-3 py-2 rounded-lg text-[13px] outline-none";
const inputStyle = { border: `1px solid ${T.line}`, background: "#fff", color: T.text };
function ProviderTag({ p }) {
  const c = p === "DU" ? T.blue : T.green;
  return <span style={{ background: c + "18", color: c }} className="px-2 py-0.5 rounded text-[11px] font-medium">{p}</span>;
}
function DateRangeBar({ mode, setMode, year, setYear, month, setMonth, from, setFrom, to, setTo, years }) {
  return (
    <div className="flex items-center gap-2 flex-wrap">
      <div style={{ border: `1px solid ${T.line}`, background: "#fff" }} className="flex rounded-lg overflow-hidden">
        {["monthly", "yearly", "custom"].map((m) => (
          <button key={m} onClick={() => setMode(m)} style={{ background: mode === m ? T.teal : "#fff", color: mode === m ? "#fff" : T.sub }} className="px-3 py-1.5 text-xs capitalize">{m}</button>
        ))}
      </div>
      {mode === "monthly" && (
        <select value={month} onChange={(e) => setMonth(+e.target.value)} style={inputStyle} className="px-2 py-1.5 rounded-lg text-xs">
          {MONTHS.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}
        </select>
      )}
      {(mode === "monthly" || mode === "yearly") && (
        <select value={year} onChange={(e) => setYear(+e.target.value)} style={inputStyle} className="px-2 py-1.5 rounded-lg text-xs">
          {years.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
      )}
      {mode === "custom" && (
        <div className="flex items-center gap-1.5">
          <input type="month" value={from} onChange={(e) => setFrom(e.target.value)} style={inputStyle} className="px-2 py-1.5 rounded-lg text-xs" />
          <span style={{ color: T.sub }}>→</span>
          <input type="month" value={to} onChange={(e) => setTo(e.target.value)} style={inputStyle} className="px-2 py-1.5 rounded-lg text-xs" />
        </div>
      )}
    </div>
  );
}
function useRange() {
  const now = new Date();
  const [mode, setMode] = useState("yearly");
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const [from, setFrom] = useState(`${now.getFullYear()}-01`);
  const [to, setTo] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`);
  const range = useMemo(() => {
    if (mode === "monthly") { const mk = monthKey(year, month); return { from: mk, to: mk }; }
    if (mode === "yearly") return { from: `${year}-01`, to: `${year}-12` };
    return { from, to };
  }, [mode, year, month, from, to]);
  return { mode, setMode, year, setYear, month, setMonth, from, setFrom, to, setTo, range };
}

/* ============================== 1. DASHBOARD ============================== */
function Dashboard({ connections, bills, settings, setTab }) {
  const cur = settings.currency;
  const [gq, setGq] = useState("");
  const [kpiDetail, setKpiDetail] = useState(null);
  const analysed = useMemo(() => bills.filter((b) => b.analysed).map((b) => allocate(b, connections, settings)), [bills, connections, settings]);
  const years = useMemo(() => { const ys = new Set(bills.map((b) => parseMK(b.monthKey).y)); ys.add(new Date().getFullYear()); return [...ys].sort((a, b) => b - a); }, [bills]);
  const r = useRange();
  const cur_rows = analysed.filter((a) => inRange(a.month, r.range.from, r.range.to));
  const prevRange = useMemo(() => {
    const f = parseMK(r.range.from), t = parseMK(r.range.to);
    const span = (t.y * 12 + t.m) - (f.y * 12 + f.m);
    const pe = f.y * 12 + f.m - 1; const ps = pe - span;
    const idxToMK = (idx) => { const y = Math.floor((idx - 1) / 12); const m = ((idx - 1) % 12) + 1; return monthKey(y, m); };
    return { from: idxToMK(ps + 1), to: idxToMK(pe + 1) };
  }, [r.range]);
  const prev_rows = analysed.filter((a) => inRange(a.month, prevRange.from, prevRange.to));
  const sum = (rows, key) => rows.reduce((s, x) => s + (x[key] || 0), 0);
  const totRent = sum(cur_rows, "basicRental") + sum(cur_rows, "localSms");
  const totVat = sum(cur_rows, "vat");
  const totStaff = sum(cur_rows, "staff");
  const totExtra = sum(cur_rows, "localSms") + sum(cur_rows, "staff");
  const grand = sum(cur_rows, "total");
  const pGrand = sum(prev_rows, "total");
  const delta = pGrand ? ((grand - pGrand) / pGrand) * 100 : null;
  const byCompany = useMemo(() => { const m = {}; cur_rows.forEach((a) => { m[a.company] = (m[a.company] || 0) + a.companyCost; }); return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value); }, [cur_rows]);
  const trendData = useMemo(() => { const m = {}; analysed.forEach((a) => { if (!a.month) return; m[a.month] = (m[a.month] || 0) + (a.total || 0); }); return Object.keys(m).sort().slice(-8).map((mk) => { const { y, mo } = { y: parseMK(mk).y, mo: parseMK(mk).m }; return { label: MONTHS[mo - 1] + " '" + String(y).slice(2), value: m[mk] }; }); }, [analysed]);
  const providerSplit = useMemo(() => { let du = 0, et = 0; cur_rows.forEach((r) => { if (r.provider === "DU") du += r.total; else et += r.total; }); return [{ name: "DU", value: du }, { name: "Etisalat", value: et }].filter((x) => x.value > 0); }, [cur_rows]);
  const trend = useMemo(() => { const m = {}; analysed.forEach((a) => { m[a.month] = (m[a.month] || 0) + a.total; }); return Object.keys(m).sort().map((mk) => ({ month: mkLabel(mk), Total: +m[mk].toFixed(2) })); }, [analysed]);
  const byProvider = useMemo(() => { const m = {}; cur_rows.forEach((a) => { m[a.provider] = (m[a.provider] || 0) + a.total; }); return Object.entries(m).map(([name, value]) => ({ name, value })); }, [cur_rows]);
  const active = connections.filter((c) => c.status !== "cancelled").length;
  const acct = useMemo(() => {
    const s = { DU: { active: 0, inactive: 0 }, Etisalat: { active: 0, inactive: 0 } };
    connections.forEach((c) => {
      const p = c.provider === "DU" ? "DU" : "Etisalat";
      if ((c.status || "active") === "cancelled") s[p].inactive++; else s[p].active++;
    });
    return s;
  }, [connections]);
  const byCompanyCount = useMemo(() => {
    const m = {};
    connections.forEach((c) => { const co = (c.company || "—").trim() || "—"; m[co] = (m[co] || 0) + 1; });
    return Object.entries(m).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
  }, [connections]);
  const unidentified = [...findUnidentified(bills, connections)];
  const pendingApprovalCount = bills.filter((b) => b.analysed && !b.approved).length;
  const committedGrand = sum(cur_rows.filter((r) => r.approved && r.conn), "total");
  const pie = [T.teal, T.blue, T.amber, T.green, T.tealDk, T.red];
  const showKpi = (field, title, accent) => {
    const byCo = {}; const byProv = { DU: 0, Etisalat: 0 };
    cur_rows.forEach((r) => { const v = field(r) || 0; const co = r.company || "—"; byCo[co] = (byCo[co] || 0) + v; byProv[r.provider === "DU" ? "DU" : "Etisalat"] += v; });
    const rows = Object.entries(byCo).map(([k, v]) => ({ k, v })).filter((x) => Math.abs(x.v) > 0.001).sort((a, b) => b.v - a.v);
    setKpiDetail({ title, accent, rows, byProv, grand: rows.reduce((s, x) => s + x.v, 0) });
  };

  return (
    <React.Fragment>
      <PageHeader title="Dashboard" subtitle="Utilisation, rent, VAT and company allocation at a glance">
        <DateRangeBar {...r} years={years} />
      </PageHeader>
      <div className="p-8 space-y-6">
        {(() => {
          const committed = analysed.filter((a) => a.approved).reduce((s, a) => s + a.total, 0);
          const nowMk = monthKey(new Date().getFullYear(), new Date().getMonth() + 1);
          const thisMonth = analysed.filter((a) => a.month === nowMk).reduce((s, a) => s + a.total, 0);
          const duT = analysed.filter((a) => a.provider === "DU").reduce((s, a) => s + a.total, 0);
          const etT = analysed.filter((a) => a.provider !== "DU").reduce((s, a) => s + a.total, 0);
          const items = [
            ["TOTAL COMMITTED", money(committed, cur), T.teal],
            ["THIS MONTH", money(thisMonth, cur), T.blue],
            ["DU", money(duT, cur), T.blue],
            ["ETISALAT", money(etT, cur), T.green],
            ["ACTIVE ACCOUNTS", String(active), T.tealDk],
            ["UNIDENTIFIED", String(unidentified.length), unidentified.length ? T.red : T.green],
            ["COMPANIES", String(byCompanyCount.length), T.purple],
            ["BILLS ANALYSED", String(analysed.length), T.sub],
          ];
          const bright = { [T.teal]: "#8AA0FF", [T.blue]: "#B69CFF", [T.green]: "#5FE0A0", [T.tealDk]: "#8AA0FF", [T.red]: "#FF8A7A", [T.purple]: "#C4A9FF", [T.sub]: "#C9C6E4", [T.amber]: "#F2B968" };
          const Cell = ({ it, k }) => (
            <span key={k} className="inline-flex items-center gap-2 px-5" style={{ borderRight: "1px solid rgba(255,255,255,.08)" }}>
              <span style={{ background: bright[it[2]] || "#fff", width: 6, height: 6, borderRadius: 99, display: "inline-block" }} />
              <span style={{ color: "rgba(255,255,255,.55)", fontSize: 11, letterSpacing: .3 }}>{it[0]}</span>
              <span style={{ color: bright[it[2]] || "#fff", fontWeight: 700, fontSize: 13 }}>{it[1]}</span>
            </span>
          );
          return (
            <div className="ticker-wrap rounded-2xl overflow-hidden flex items-stretch" style={{ background: `linear-gradient(90deg,${T.inkSoft},${T.ink})`, border: `1px solid ${T.line}` }}>
              <div className="flex items-center gap-2 px-4 shrink-0" style={{ background: "rgba(255,255,255,.06)" }}>
                <span className="live-dot" style={{ width: 8, height: 8, borderRadius: 99, background: "#4ADE80", display: "inline-block", boxShadow: "0 0 8px #4ADE80" }} />
                <span style={{ color: "#fff", fontSize: 11, fontWeight: 700, letterSpacing: 1 }}>LIVE</span>
              </div>
              <div className="ticker-track py-3 overflow-hidden">
                {items.map((it, i) => <Cell it={it} k={"a" + i} />)}
                {items.map((it, i) => <Cell it={it} k={"b" + i} />)}
              </div>
            </div>
          );
        })()}

        <div className="relative">
          <Search size={16} style={{ color: T.sub }} className="absolute left-3.5 top-1/2 -translate-y-1/2" />
          <input value={gq} onChange={(e) => setGq(e.target.value)} placeholder="Search everything — account, user, company, invoice, bill file…" style={{ ...inputStyle, paddingLeft: 40, height: 44, fontSize: 14 }} className="w-full rounded-xl outline-none" />
          {gq.trim() && (() => {
            const s = gq.toLowerCase();
            const cRes = connections.filter((c) => [c.accountNumber, c.userName, c.company, c.department, c.provider].some((v) => String(v || "").toLowerCase().includes(s))).slice(0, 6);
            const bRes = bills.filter((b) => [b.accountNumber, b.invoiceNumber, b.fileName, b.provider, b.monthKey].some((v) => String(v || "").toLowerCase().includes(s))).slice(0, 6);
            return (
              <div style={{ background: T.card, border: `1px solid ${T.line}`, boxShadow: "0 10px 30px rgba(0,0,0,.08)" }} className="absolute z-20 mt-2 w-full rounded-xl overflow-hidden">
                {cRes.length === 0 && bRes.length === 0 && <div className="px-4 py-4 text-sm" style={{ color: T.sub }}>No matches.</div>}
                {cRes.length > 0 && <div className="px-4 pt-3 pb-1 text-[11px] font-semibold" style={{ color: T.sub }}>CONNECTIONS</div>}
                {cRes.map((c) => (
                  <button key={c.id} onClick={() => setTab("connections")} className="w-full text-left px-4 py-2 flex items-center gap-3 text-[13px]" style={{ borderTop: `1px solid ${T.line}` }}>
                    <ProviderTag p={c.provider} /><span className="font-medium">{c.accountNumber}</span><span style={{ color: T.sub }}>{c.userName} · {c.company}</span>
                  </button>
                ))}
                {bRes.length > 0 && <div className="px-4 pt-3 pb-1 text-[11px] font-semibold" style={{ color: T.sub }}>BILLS</div>}
                {bRes.map((b) => (
                  <button key={b.id} onClick={() => setTab("analysis")} className="w-full text-left px-4 py-2 flex items-center gap-3 text-[13px]" style={{ borderTop: `1px solid ${T.line}` }}>
                    <ProviderTag p={b.provider} /><span className="font-medium">{b.accountNumber || b.fileName}</span><span style={{ color: T.sub }}>{b.invoiceNumber} · {mkLabel(b.monthKey)}</span>
                  </button>
                ))}
              </div>
            );
          })()}
        </div>
        {unidentified.length > 0 && (
          <Card className="p-5 flex items-start gap-3" style={{ background: T.amberSoft, borderColor: T.amber + "55" }}>
            <AlertCircle size={20} style={{ color: T.amber }} className="mt-0.5" />
            <div className="flex-1">
              <div className="font-medium">{unidentified.length} unidentified account{unidentified.length > 1 ? "s" : ""} found in your bills</div>
              <div style={{ color: T.sub }} className="text-xs mt-0.5">
                These account numbers appear on uploaded bills but are not in the Connections page:{" "}
                <span className="font-mono" style={{ color: T.amber }}>{unidentified.slice(0, 8).join(", ")}{unidentified.length > 8 ? "…" : ""}</span>.
                Add them under Connections, or see the <b>Unidentified Accounts</b> report.
              </div>
            </div>
          </Card>
        )}
        {pendingApprovalCount > 0 && (
          <Card className="p-5 flex items-start gap-3" style={{ background: T.tealSoft, borderColor: T.teal + "40" }}>
            <Check size={20} style={{ color: T.tealDk }} className="mt-0.5" />
            <div className="flex-1">
              <div className="font-medium">{pendingApprovalCount} analysed bill{pendingApprovalCount > 1 ? "s" : ""} awaiting approval</div>
              <div style={{ color: T.sub }} className="text-xs mt-0.5">Go to <b>Analysis &amp; Allocation</b> and click <b>Approve All</b> to commit these costs to the system.</div>
            </div>
          </Card>
        )}
        {cur_rows.length === 0 && (
          <Card className="p-6 flex items-center gap-3" style={{ background: T.tealSoft, borderColor: T.teal + "40" }}>
            <AlertCircle size={20} style={{ color: T.tealDk }} />
            <div>
              <div className="font-medium">No bill data in this period yet.</div>
              <div style={{ color: T.sub }} className="text-xs">Add bills in <b>Bill Upload</b>, then enter their figures under <b>Analysis &amp; Allocation</b> to populate the dashboard.</div>
            </div>
          </Card>
        )}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <Kpi label="Total Expense" value={money(grand, cur)} delta={delta} accent={T.teal} onClick={() => showKpi((r) => r.total, "Total Expense — by company", T.teal)} />
          <Kpi label="Monthly Rent (incl. Local calls & SMS)" value={money(totRent, cur)} accent={T.blue} onClick={() => showKpi((r) => (r.basicRental || 0) + (r.localSms || 0), "Monthly Rent — by company", T.blue)} />
          <Kpi label="VAT" value={money(totVat, cur)} accent={T.tealDk} onClick={() => showKpi((r) => r.vat, "VAT — by company", T.tealDk)} />
          <Kpi label="Staff Chargeable Usage" value={money(totStaff, cur)} accent={T.amber} onClick={() => showKpi((r) => r.staff, "Staff Chargeable — by company", T.amber)} />
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <Kpi label="Extra Usage (total)" value={money(totExtra, cur)} accent={T.amber} small />
          <Kpi label="Active Connections" value={String(active)} accent={T.teal} small />
          <Kpi label="Bills in Period" value={String(cur_rows.length)} accent={T.blue} small />
          <Kpi label="Committed expense (approved & identified)" value={money(committedGrand, cur)} accent={T.tealDk} small />
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <AcctStat label="Total accounts" total={acct.DU.active + acct.DU.inactive + acct.Etisalat.active + acct.Etisalat.inactive} du={acct.DU.active + acct.DU.inactive} eti={acct.Etisalat.active + acct.Etisalat.inactive} accent={T.purple} />
          <AcctStat label="Active accounts" total={acct.DU.active + acct.Etisalat.active} du={acct.DU.active} eti={acct.Etisalat.active} accent={T.teal} />
          <AcctStat label="Inactive accounts" total={acct.DU.inactive + acct.Etisalat.inactive} du={acct.DU.inactive} eti={acct.Etisalat.inactive} accent={T.red} />
        </div>
        <Card className="p-5">
          <div className="font-medium mb-3">Accounts by company</div>
          <FancyChart data={byCompanyCount.map((x) => ({ name: x.name, value: x.count }))} colors={pie} cur={cur} mode="count" initial="column" />
        </Card>
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <Card className="p-5 lg:col-span-2">
            <div className="flex items-center gap-2 mb-3"><span style={{ background: T.teal, boxShadow: `0 0 6px ${T.teal}66` }} className="w-2 h-2 rounded-full" /><div className="font-medium">Total Expense Trend</div><span style={{ color: T.sub }} className="text-xs">· last {trendData.length} month(s)</span></div>
            <TrendChart data={trendData} cur={cur} accent={T.teal} />
          </Card>
          <Card className="p-5">
            <div className="flex items-center gap-2 mb-3"><span style={{ background: T.blue, boxShadow: `0 0 6px ${T.blue}66` }} className="w-2 h-2 rounded-full" /><div className="font-medium">Provider Split</div></div>
            <FancyChart data={providerSplit} colors={[T.blue, T.green]} cur={cur} mode="money" initial="donut" />
          </Card>
        </div>
        <Card className="p-5">
          <div className="font-medium mb-3">Company-wise utilisation (company-borne cost)</div>
          <FancyChart data={byCompany} colors={pie} cur={cur} mode="money" initial="bar" />
        </Card>
      </div>
      {kpiDetail && (
        <Modal title={kpiDetail.title} onClose={() => setKpiDetail(null)} wide>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <div className="kpi-3d p-3"><div className="text-xs" style={{ color: T.sub }}>DU</div><div className="num-emboss text-xl" style={{ ["--nc"]: T.blue }}>{money(kpiDetail.byProv.DU, cur)}</div></div>
            <div className="kpi-3d p-3"><div className="text-xs" style={{ color: T.sub }}>Etisalat</div><div className="num-emboss text-xl" style={{ ["--nc"]: T.green }}>{money(kpiDetail.byProv.Etisalat, cur)}</div></div>
          </div>
          <div className="space-y-2 max-h-[50vh] overflow-y-auto">
            {kpiDetail.rows.map((x, i) => { const max = kpiDetail.rows[0]?.v || 1; return (
              <div key={x.k} className="flex items-center gap-3 text-[13px]">
                <div className="w-40 shrink-0 truncate" style={{ color: T.sub }} title={x.k}>{x.k}</div>
                <div className="flex-1 h-5 rounded-md overflow-hidden" style={{ background: T.paper }}><div style={{ width: `${(x.v / max) * 100}%`, background: pie[i % pie.length], height: "100%" }} /></div>
                <div className="w-24 text-right font-semibold">{money(x.v, cur)}</div>
              </div>
            ); })}
            {kpiDetail.rows.length === 0 && <div className="text-sm py-6 text-center" style={{ color: T.sub }}>No data for this metric in the selected period.</div>}
          </div>
          <div className="flex justify-between items-center mt-4 pt-3" style={{ borderTop: `1px solid ${T.line}` }}>
            <span className="text-sm font-medium">Total</span>
            <span className="num-emboss text-lg" style={{ ["--nc"]: kpiDetail.accent }}>{money(kpiDetail.grand, cur)}</span>
          </div>
        </Modal>
      )}
    </React.Fragment>
  );
}
function AcctStat({ label, total, du, eti, accent }) {
  return (
    <div className="kpi-3d cap-3d p-4" style={{ ["--acc"]: accent }}>
      <div className="flex items-center gap-2 mb-1">
        <span style={{ background: accent, boxShadow: `0 0 6px ${accent}66` }} className="w-2.5 h-2.5 rounded-full" />
        <span style={{ color: T.sub }} className="text-xs">{label}</span>
      </div>
      <div className="num-emboss text-2xl">{total}</div>
      <div className="flex gap-2 mt-2">
        <span style={{ background: T.blue + "16", color: T.blue }} className="px-2 py-0.5 rounded text-[11px] font-medium">DU: {du}</span>
        <span style={{ background: T.green + "18", color: T.green }} className="px-2 py-0.5 rounded text-[11px] font-medium">Etisalat: {eti}</span>
      </div>
    </div>
  );
}
function Kpi({ label, value, delta, accent, small, onClick }) {
  return (
    <div onClick={onClick} className={`kpi-3d cap-3d p-4 ${onClick ? "clickable" : ""}`} style={{ ["--acc"]: accent }}>
      <div className="flex items-center gap-2 mb-1">
        <span style={{ background: accent, boxShadow: `0 0 6px ${accent}66` }} className="w-2 h-2 rounded-full" />
        <span style={{ color: T.sub }} className="text-xs">{label}</span>
        {onClick && <ChevronRight size={13} style={{ color: T.sub }} className="ml-auto" />}
      </div>
      <div className={`num-emboss ${small ? "text-lg" : "text-2xl"}`}>{value}</div>
      {delta !== null && delta !== undefined && (
        <div className="flex items-center gap-1 mt-1 text-xs" style={{ color: delta > 0 ? T.red : delta < 0 ? T.green : T.sub }}>
          {delta > 0 ? <ArrowUpRight size={13} /> : delta < 0 ? <ArrowDownRight size={13} /> : <Minus size={13} />}
          {Math.abs(delta).toFixed(1)}% vs previous period
        </div>
      )}
    </div>
  );
}

/* ============================== 2. CONNECTIONS ============================== */
function Connections({ connections, save, settings, flash }) {
  const [editing, setEditing] = useState(null);
  const [cancelling, setCancelling] = useState(null);
  const [importRes, setImportRes] = useState(null);
  const [q, setQ] = useState("");
  const cur = settings.currency;
  const importRef = useRef();
  const doImport = async (file) => {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const wsName = wb.SheetNames.find((n) => /connection/i.test(n)) || wb.SheetNames[0];
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wsName], { header: 1, defval: "" });
      const res = importConnections(aoa, connections, settings.vatRate);
      save(res.next);
      setImportRes(res);
    } catch (e) {
      console.error(e);
      alert("Could not read this file. Please fill and upload the .xlsx template (use the Template button).");
    }
  };
  const filtered = connections.filter((c) => {
    const s = q.toLowerCase();
    return !s || [c.accountNumber, c.userName, c.company, c.department].some((v) => (v || "").toLowerCase().includes(s));
  });
  const onSave = (c) => {
    let next;
    const norm = c.status === "cancelled" ? c : { ...c, status: c.status || "active", cancellation: undefined };
    if (c.id) next = connections.map((x) => (x.id === c.id ? norm : x));
    else next = [...connections, { ...norm, id: uid(), sn: nextSN(connections), status: c.status || "active", createdAt: Date.now() }];
    save(next); setEditing(null); flash(c.id ? "Connection updated" : "Connection added");
  };
  const onDelete = (id) => { if (confirm("Delete this connection permanently?")) { save(connections.filter((c) => c.id !== id)); flash("Deleted"); } };
  const onCancel = (id, reason, date) => { save(connections.map((c) => (c.id === id ? { ...c, status: "cancelled", cancellation: { reason, date } } : c))); setCancelling(null); flash("Connection cancelled"); };
  const onReactivate = (id) => { save(connections.map((c) => (c.id === id ? { ...c, status: "active", cancellation: undefined } : c))); flash("Connection re-activated"); };

  return (
    <React.Fragment>
      <PageHeader title="Connections" subtitle={`${connections.length} total · ${connections.filter((c) => c.status !== "cancelled").length} active`}>
        <div className="relative">
          <Search size={15} style={{ color: T.sub }} className="absolute left-2.5 top-2.5" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search…" style={inputStyle} className="pl-8 pr-3 py-2 rounded-lg text-[13px] w-56" />
        </div>
        <Btn variant="ghost" onClick={downloadConnTemplate}><Download size={15} /> Template</Btn>
        <input ref={importRef} type="file" accept=".xlsx,.xls" hidden onChange={(e) => { doImport(e.target.files[0]); e.target.value = ""; }} />
        <Btn variant="dark" onClick={() => importRef.current?.click()}><Upload size={15} /> Import Excel</Btn>
        <Btn onClick={() => setEditing("new")}><Plus size={15} /> Add new connection</Btn>
      </PageHeader>
      <div className="p-8">
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full text-[13px]">
              <thead>
                <tr style={{ borderBottom: `1px solid ${T.line}`, color: T.sub }} className="text-left text-xs">
                  {["S/N", "Account #", "User", "Company", "Dept.", "Provider", "Basic Rent", "Total + VAT", "Initiated", "Status", ""].map((h) => <th key={h} className="px-3 py-3 font-medium whitespace-nowrap">{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 && (
                  <tr><td colSpan={11} className="px-3 py-10 text-center" style={{ color: T.sub }}>No connections yet. Click <b>Add new connection</b> to start.</td></tr>
                )}
                {filtered.map((c) => {
                  const t = connTotals(c);
                  return (
                    <tr key={c.id} style={{ borderBottom: `1px solid ${T.line}` }}>
                      <td className="px-3 py-2.5 font-mono text-xs">{c.sn}</td>
                      <td className="px-3 py-2.5 font-medium">{c.accountNumber}</td>
                      <td className="px-3 py-2.5">{c.userName}</td>
                      <td className="px-3 py-2.5">{c.company}</td>
                      <td className="px-3 py-2.5">{c.department}</td>
                      <td className="px-3 py-2.5"><ProviderTag p={c.provider} /></td>
                      <td className="px-3 py-2.5">{money(t.base, cur)}</td>
                      <td className="px-3 py-2.5 font-medium">{money(t.total, cur)}</td>
                      <td className="px-3 py-2.5 whitespace-nowrap">{c.initiatedDate || "—"}</td>
                      <td className="px-3 py-2.5">
                        {c.status === "cancelled"
                          ? <span style={{ background: T.red + "18", color: T.red }} className="px-2 py-0.5 rounded text-[11px]">Cancelled</span>

      {importRes && <ImportResultModal res={importRes} onClose={() => setImportRes(null)} />}
    </React.Fragment>
  );
}

function BillUpload({ bills, save, flash }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const [provider, setProvider] = useState("Etisalat");
  const fileRef = useRef();
  const mk = monthKey(year, month);
  const years = [];
  for (let y = now.getFullYear() + 1; y >= now.getFullYear() - 6; y--) years.push(y);
  const periodBills = bills.filter((b) => b.monthKey === mk);
  const [selected, setSelected] = useState([]);
  useEffect(() => { setSelected([]); }, [mk]);
  const toggle = (id) => setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  const allSelected = periodBills.length > 0 && selected.length === periodBills.length;
  const toggleAll = () => setSelected(allSelected ? [] : periodBills.map((b) => b.id));
  const stateOf = (ids) => { const set = new Set(ids); const arr = bills.filter((b) => set.has(b.id)); return { analysed: arr.filter((b) => b.analysed).length, approved: arr.filter((b) => b.approved).length }; };
  const warnSuffix = (ids) => { const { analysed, approved } = stateOf(ids); return analysed ? `\n\n${analysed} of these have extracted data${approved ? ` (${approved} approved)` : ""} — their costs will be removed from the reports and dashboard.` : ""; };
  const deleteSelected = () => {
    if (!selected.length) return;
    if (confirm(`Delete ${selected.length} selected bill(s)?` + warnSuffix(selected))) {
      const set = new Set(selected); save(bills.filter((b) => !set.has(b.id))); setSelected([]); flash("Selected bills deleted");
    }
  };
  const deleteAllPeriod = () => {
    if (!periodBills.length) return;
    const ids = periodBills.map((b) => b.id);
    if (confirm(`Delete ALL ${periodBills.length} bill(s) in ${mkLabel(mk)}?` + warnSuffix(ids))) {
      const set = new Set(ids); save(bills.filter((b) => !set.has(b.id))); setSelected([]); flash(`${mkLabel(mk)} folder cleared`);
    }
  };

  const [uploading, setUploading] = useState(false);
  const onFiles = async (files) => {
    const list = [...files]; const additions = [];
    setUploading(true);
    for (const file of list) {
      const okType = file.type === "application/pdf" || file.type.startsWith("image/");
      if (!okType) { flash(`Skipped ${file.name} (only PDF / image)`); continue; }
      const id = uid();
      let storagePath = null;
      try {
        const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
        storagePath = await uploadToStorage(id, dataUrl, file.type);
      } catch (e) { console.error(e); flash(`Upload failed: ${file.name}`); continue; }
      additions.push({
        id, monthKey: mk, provider, fileName: file.name, fileType: file.type, size: file.size,
        storagePath, uploadedAt: Date.now(), analysed: false, extraUsages: [], accountNumber: "",
        invoiceNumber: "", invoicePeriod: "", basicRental: "", vat: "", total: "", otherCredits: "",
      });
    }
    setUploading(false);
    if (additions.length) { save([...bills, ...additions]); flash(`${additions.length} file(s) uploaded to ${mkLabel(mk)}`); }
  };
  const removeBill = (id) => { if (confirm("Remove this uploaded bill?")) { save(bills.filter((b) => b.id !== id)); flash("Removed"); } };
  const viewBill = async (b) => { const url = b.storagePath ? await fileSignedUrl(b.storagePath) : b.base64; if (url) window.open(url, "_blank"); else alert("File not available."); };
  const folders = useMemo(() => { const m = {}; bills.forEach((b) => { const { y } = parseMK(b.monthKey); (m[y] = m[y] || {}); (m[y][b.monthKey] = (m[y][b.monthKey] || 0) + 1); }); return m; }, [bills]);

  return (
    <React.Fragment>
      <PageHeader title="Bill Upload" subtitle="Store DU &amp; Etisalat invoices in per-period folders (PDF or image)" />
      <div className="p-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div className="lg:col-span-2 space-y-6">
          <Card className="p-5">
            <div className="grid grid-cols-3 gap-3 mb-4">
              <Field label="Year"><select value={year} onChange={(e) => setYear(+e.target.value)} style={inputStyle} className={inputCls}>{years.map((y) => <option key={y}>{y}</option>)}</select></Field>
              <Field label="Month"><select value={month} onChange={(e) => setMonth(+e.target.value)} style={inputStyle} className={inputCls}>{MONTHS.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}</select></Field>
              <Field label="Provider"><select value={provider} onChange={(e) => setProvider(e.target.value)} style={inputStyle} className={inputCls}>{PROVIDERS.map((p) => <option key={p}>{p}</option>)}</select></Field>
            </div>
            <div onClick={() => fileRef.current?.click()} onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); onFiles(e.dataTransfer.files); }}
              style={{ border: `2px dashed ${T.line}`, background: T.tealSoft + "80" }} className="rounded-xl p-8 text-center cursor-pointer">
              <Upload size={26} style={{ color: T.teal }} className="mx-auto mb-2" />
              <div className="font-medium">{uploading ? "Uploading to cloud…" : "Drop bills here or click to browse"}</div>
              <div style={{ color: T.sub }} className="text-xs mt-1">Uploading to <b>{mkLabel(mk)}</b> · <ProviderTag p={provider} /> · PDF &amp; images</div>
              <input ref={fileRef} type="file" accept="application/pdf,image/*" multiple hidden onChange={(e) => onFiles(e.target.files)} />
            </div>
          </Card>
          <Card>
            <div className="px-5 py-3 flex items-center gap-2 flex-wrap" style={{ borderBottom: `1px solid ${T.line}` }}>
              <FolderOpen size={16} style={{ color: T.teal }} />
              <span className="font-medium">{mkLabel(mk)} folder</span>
              <span style={{ color: T.sub }} className="text-xs">· {periodBills.length} file(s)</span>
              {periodBills.length > 0 && (
                <div className="flex items-center gap-2 ml-auto flex-wrap">
                  {selected.length > 0 && (
                    <React.Fragment>
                      <span style={{ color: T.sub }} className="text-xs">{selected.length} selected</span>
                      <Btn size="sm" variant="danger" onClick={deleteSelected}><Trash2 size={13} /> Delete selected</Btn>
                      <button onClick={() => setSelected([])} className="text-xs" style={{ color: T.sub }}>Clear</button>
                    </React.Fragment>
                  )}
                  <Btn size="sm" variant="ghost" onClick={deleteAllPeriod}><Trash2 size={13} /> Delete all</Btn>
                </div>
              )}
            </div>
            {periodBills.length === 0 ? (
              <div className="px-5 py-10 text-center text-xs" style={{ color: T.sub }}>This period's folder is empty.</div>
            ) : (
              <div style={{ borderColor: T.line }}>
                <label className="px-5 py-2 flex items-center gap-3 text-xs cursor-pointer select-none" style={{ color: T.sub }}>
                  <input type="checkbox" checked={allSelected} onChange={toggleAll} style={{ accentColor: T.teal, width: 15, height: 15 }} />
                  Select all
                </label>
                {periodBills.map((b) => (
                  <div key={b.id} className="px-5 py-3 flex items-center gap-3" style={{ borderTop: `1px solid ${T.line}`, background: selected.includes(b.id) ? T.tealSoft : "transparent" }}>
                    <input type="checkbox" checked={selected.includes(b.id)} onChange={() => toggle(b.id)} style={{ accentColor: T.teal, width: 15, height: 15 }} />
                    <FileText size={18} style={{ color: b.fileType === "application/pdf" ? T.red : T.blue }} />
                    <div className="flex-1 min-w-0">
                      <div className="truncate text-[13px] font-medium">{b.fileName}</div>
                      <div style={{ color: T.sub }} className="text-xs flex items-center gap-2">
                        <ProviderTag p={b.provider} /> {(b.size / 1024).toFixed(0)} KB
                        {b.analysed && <span style={{ color: T.tealDk }}>· entered</span>}
                        {!hasFile(b) && <span style={{ color: T.amber }}>· metadata only (no file)</span>}
                      </div>
                    </div>
                    {hasFile(b) && <button onClick={() => viewBill(b)} className="p-1.5" style={{ color: T.sub }} title="View"><Search size={15} /></button>}
                    <button onClick={() => removeBill(b.id)} className="p-1.5" style={{ color: T.red }}><Trash2 size={15} /></button>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </div>
        <Card className="p-5 h-fit">
          <div className="font-medium mb-3">All periods</div>
          {Object.keys(folders).length === 0 ? (
            <p style={{ color: T.sub }} className="text-xs">No bills uploaded yet.</p>
          ) : (
            Object.keys(folders).sort((a, b) => b - a).map((y) => (
              <div key={y} className="mb-3">
                <div className="flex items-center gap-1.5 font-medium text-[13px]"><CalendarDays size={14} style={{ color: T.teal }} /> {y}</div>
                <div className="ml-4 mt-1 space-y-0.5">
                  {Object.keys(folders[y]).sort().reverse().map((mkk) => (
                    <button key={mkk} onClick={() => { const { y: yy, m } = parseMK(mkk); setYear(yy); setMonth(m); }} className="w-full flex items-center justify-between text-xs px-2 py-1 rounded">
                      <span style={{ color: T.sub }}>{mkLabel(mkk)}</span>
                      <span style={{ background: T.tealSoft, color: T.tealDk }} className="px-1.5 rounded">{folders[y][mkk]}</span>
                    </button>
                  ))}
                </div>
              </div>
            ))
          )}
        </Card>
      </div>
    </React.Fragment>
  );
}

function Analysis({ bills, saveBills, connections, settings, flash, addConnection, setTab, notifyUnidentified }) {
  const [open, setOpen] = useState(null);
  const [addConn, setAddConn] = useState(null);
  const [busy, setBusy] = useState(null);
  const cur = settings.currency;
  const unidentified = findUnidentified(bills, connections);
  const updateBill = (id, patch) => saveBills(bills.map((b) => (b.id === id ? { ...b, ...patch } : b)));
  const [approveOpen, setApproveOpen] = useState(false);
  const isIdentified = (b) => { const n = normAcc(b.accountNumber); return !!n && connections.some((c) => normAcc(c.accountNumber) === n); };
  const analysedList = bills.filter((b) => b.analysed);
  const approvedList = bills.filter((b) => b.approved);
  const pendingIdentified = bills.filter((b) => b.analysed && !b.approved && isIdentified(b));
  const pendingUnidentified = bills.filter((b) => b.analysed && !b.approved && !isIdentified(b));
  const allApproved = approvedList.length > 0 && pendingIdentified.length === 0;
  const doApproveAll = () => {
    const n = pendingIdentified.length;
    saveBills(bills.map((b) => (b.analysed && !b.approved && isIdentified(b) ? { ...b, approved: true, approvedAt: b.approvedAt || Date.now() } : b)));
    setApproveOpen(false);
    flash(n + " identified bill(s) approved & committed to expenses");
  };
  const analyseOne = async (bill, review = true) => {
    if (!hasFile(bill)) { flash("No file available — enter data manually"); if (review) setOpen(bill.id); return; }
    setBusy(bill.id);
    try {
      const content = await readBillContent(bill);
      let patch;
      if (settings.apiKey) {
        patch = await aiExtract(bill, settings, content);
      } else {
        let text = content.text;
        if (!text && content.imageDataUrl && window.Tesseract) { const r = await window.Tesseract.recognize(content.imageDataUrl, "eng"); text = r.data.text; }
        patch = heuristicParse(text || "", bill.provider);
        patch.extraUsages = bill.extraUsages || [];
      }
      refineFromFilename(patch, bill.fileName, bill.provider);
      const merged = { ...patch, rawText: (content.text || "").slice(0, 8000) };
      const dmk = periodToMonthKey(patch.invoicePeriod); if (dmk) merged.monthKey = dmk;
      if (review) { updateBill(bill.id, merged); setOpen(bill.id); }
      else { updateBill(bill.id, { ...merged, analysed: true }); }
      flash(settings.apiKey ? "Analysed with AI — review & save" : "Read from file — review the figures & save");
    } catch (e) {
      console.error(e); flash("Couldn't read this file — enter data manually"); if (review) setOpen(bill.id);
    } finally { setBusy(null); }
  };
  const analyseAll = async () => {
    const targets = bills.filter((b) => !b.analysed && hasFile(b));
    if (!targets.length) { flash("No new bills to analyse (already-analysed bills are left as-is — use a row's Analyse button to redo one)"); return; }
    const patches = {};
    for (const b of targets) {
      setBusy(b.id);
      try {
        const content = await readBillContent(b);
        let patch;
        if (settings.apiKey) {
          patch = await aiExtract(b, settings, content);
        } else {
          let text = content.text;
          if (!text && content.imageDataUrl && window.Tesseract) { const r = await window.Tesseract.recognize(content.imageDataUrl, "eng"); text = r.data.text; }
          patch = heuristicParse(text || "", b.provider);
          patch.extraUsages = b.extraUsages || [];
        }
        refineFromFilename(patch, b.fileName, b.provider);
        const dmk = periodToMonthKey(patch.invoicePeriod);
        patches[b.id] = { ...patch, rawText: (content.text || "").slice(0, 8000), analysed: true, ...(dmk ? { monthKey: dmk } : {}) };
      } catch (e) { console.error("analyse failed", b.fileName, e); }
    }
    setBusy(null);
    const done = Object.keys(patches).length;
    if (done) saveBills(bills.map((b) => (patches[b.id] ? { ...b, ...patches[b.id] } : b)));
    const matched = targets.filter((b) => { const n = normAcc(patches[b.id]?.accountNumber); return n && connections.some((c) => normAcc(c.accountNumber) === n); }).length;
    flash(`Analysed ${done} bill(s): ${matched} matched to connections, ${done - matched} unidentified`);
    if (done - matched > 0 && notifyUnidentified) setTimeout(() => notifyUnidentified(), 3000);
  };
  const rows = useMemo(() => bills.filter((b) => b.analysed).map((b) => ({ bill: b, alloc: allocate(b, connections, settings) })), [bills, connections, settings]);
  const openBill = bills.find((b) => b.id === open);
  const [provFilter, setProvFilter] = useState("all");
  const [manualOpen, setManualOpen] = useState(false);
  const addManualBill = (b) => { saveBills([...bills, b]); setManualOpen(false); flash("Bill added manually"); };
  const [q, setQ] = useState("");
  const [preview, setPreview] = useState(null);
  const openPreview = async (b) => { const url = b.storagePath ? await fileSignedUrl(b.storagePath) : b.base64; if (!url) { flash("File not available to preview."); return; } setPreview({ url, type: b.fileType, name: b.fileName }); };
  const [collapsed, setCollapsed] = useState(() => new Set());
  const toggleCollapse = (mk) => setCollapsed((s) => { const n = new Set(s); n.has(mk) ? n.delete(mk) : n.add(mk); return n; });
  const statusRank = (b) => {
    if (b.approved) return 3;              // approved -> bottom
    if (!b.analysed) return 1;             // new/unanalysed -> near top
    const n = normAcc(b.accountNumber);
    const identified = n && connections.some((c) => normAcc(c.accountNumber) === n);
    return identified ? 2 : 0;             // unidentified -> very top
  };
  const matchQ = (b) => { if (!q.trim()) return true; const s = q.toLowerCase(); const a = allocate(b, connections, settings); return [b.accountNumber, b.invoiceNumber, b.fileName, b.provider, b.monthKey, a.user, a.company].some((v) => String(v || "").toLowerCase().includes(s)); };
  const grouped = useMemo(() => {
    const m = {};
    bills.filter((b) => (provFilter === "all" || b.provider === provFilter) && matchQ(b)).forEach((b) => (m[b.monthKey] = m[b.monthKey] || []).push(b));
    return Object.keys(m).sort().reverse().map((mk) => ({ mk, list: m[mk].slice().sort((x, y) => statusRank(x) - statusRank(y)) }));
  }, [bills, provFilter, connections, q]);

  const exportRows = (billList, fileName) => {
    const head = ["Month", "Provider", "Account #", "Invoice #", "User", "Company", "Department", "Basic Rental", "Local Calls & SMS", "Staff Charge", "VAT", "Total", "Status"];
    const rowsOut = [];
    billList.filter((b) => b.analysed).forEach((b) => {
      const a = allocate(b, connections, settings);
      const status = b.approved ? "Approved" : (normAcc(b.accountNumber) && connections.some((c) => normAcc(c.accountNumber) === normAcc(b.accountNumber))) ? "Pending" : "Unidentified";
      rowsOut.push([mkLabel(b.monthKey), b.provider, b.accountNumber, b.invoiceNumber || "", a.user, a.company, a.department, a.basicRental, a.localSms || 0, a.staff || 0, a.vat, a.total, status]);
    });
    if (!rowsOut.length) { flash("Nothing to export"); return; }
    const sum = (i) => rowsOut.reduce((s, r) => s + (parseFloat(r[i]) || 0), 0);
    rowsOut.push(["TOTAL", "", "", "", "", "", "", sum(7), sum(8), sum(9), sum(10), sum(11), ""]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...rowsOut]), "Allocation");
    XLSX.writeFile(wb, fileName);
    flash(`Exported ${rowsOut.length - 1} row(s)`);
  };
  const exportDetail = () => { const all = grouped.flatMap((g) => g.list); const tag = provFilter === "all" ? "all" : provFilter; exportRows(all, `allocation-${tag}${q ? "-filtered" : ""}.xlsx`); };
  const exportMonth = (mk, list) => exportRows(list, `allocation-${mk}.xlsx`);

  return (
    <React.Fragment>
      <PageHeader title="Analysis &amp; Allocation" subtitle="Reads your uploaded bills, matches connections, splits usage, and prepares reports">
        <span style={{ color: settings.apiKey ? T.tealDk : T.sub }} className="text-xs mr-1">{settings.apiKey ? "● AI analysis on" : "Basic extraction (add API key in Settings for AI)"}</span>
        <Btn variant="ghost" size="sm" onClick={exportDetail}><Download size={14} /> Export detail</Btn>
        <Btn variant="ghost" size="sm" onClick={() => setManualOpen(true)}><Plus size={14} /> Add bill</Btn>
        <Btn onClick={analyseAll} disabled={!!busy}><Sparkles size={15} /> Analyse all bills</Btn>

      <div className="p-8 space-y-6">

          <Card className="p-4 flex items-start gap-3" style={{ background: T.amberSoft, borderColor: T.amber + "55" }}>
            <AlertCircle size={18} style={{ color: T.amber }} className="mt-0.5" />
            <div className="flex-1 text-[13px]">
              <span className="font-medium">{unidentified.size} unidentified account{unidentified.size > 1 ? "s" : ""}</span>
              <span style={{ color: T.sub }}> — highlighted in amber below. Click <b>Add connection</b> on a row to register it, or open the <b>Unidentified Accounts</b> report.</span>
            </div>

        {analysedList.length > 0 && (

              </div>

            <div className="flex gap-2">
              <Btn size="sm" variant="ghost" onClick={() => setCollapsed(new Set(grouped.map((g) => g.mk)))}>Collapse all</Btn>

        {grouped.map(({ mk, list }) => {

                        <td className="px-3 py-2.5">{a ? (matched ? <span>{a.user}<br /><span style={{ color: T.sub }} className="text-xs">{a.company}</span></span> : <span style={{ color: T.amber }} className="text-xs">no matching connection</span>) : "—"}</td>
                        <td className="px-3 py-2.5">{a ? money(a.basicRental, cur) : "—"}</td>

                        <td className="px-3 py-2.5 font-medium">{a ? money(a.total, cur) : "—"}</td>
                        <td className="px-3 py-2.5">
                          <div className="flex items-center gap-1 justify-end">
                            {b.approved && <span style={{ background: T.teal + "18", color: T.tealDk }} className="px-2 py-0.5 rounded text-[11px] font-medium flex items-center gap-1"><Check size={11} /> Approved</span>}
                            {hasFile(b) && <button onClick={() => openPreview(b)} className="p-1.5" style={{ color: T.sub }} title="Preview bill"><Eye size={15} /></button>}
                            {unmatched && (
                              <Btn size="sm" variant="amber" onClick={() => setAddConn({ accountNumber: b.accountNumber, provider: b.provider, basicRent: b.basicRental || "" })}>
                                <Plus size={13} /> Add connection
                              </Btn>
                            )}
                            {hasFile(b) && (
                              <Btn size="sm" variant="dark" onClick={() => analyseOne(b, true)} disabled={busy === b.id}>
                                {busy === b.id ? <Loader2 size={13} className="animate-spin" /> : <Sparkles size={13} />} Analyse
                              </Btn>
                            )}
                            <Btn size="sm" variant={b.analysed ? "ghost" : "primary"} onClick={() => setOpen(b.id)}>
                              {b.analysed ? <React.Fragment><Pencil size={13} /> Edit</React.Fragment> : <React.Fragment><Plus size={13} /> Enter data</React.Fragment>}
                            </Btn>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            )}
          </Card>
          );
        })}
        {rows.length > 0 && <AllocationPreview rows={rows} settings={settings} />}
      </div>
      {openBill && <BillEditModal bill={openBill} connections={connections} settings={settings} onSave={(patch) => { updateBill(openBill.id, { ...patch, analysed: true, approvedAt: patch.approved ? (openBill.approvedAt || Date.now()) : null }); setOpen(null); flash("Bill saved"); }} onClose={() => setOpen(null)} />}
      {addConn && <ConnectionModal conn={null} settings={settings} nextSN={nextSN(connections)} prefill={addConn} onSave={(f) => { addConnection(f); setAddConn(null); flash("Connection added — bill now identified"); }} onClose={() => setAddConn(null)} />}
      {manualOpen && <ManualBillModal connections={connections} settings={settings} onSave={addManualBill} onClose={() => setManualOpen(false)} />}
      {preview && (
        <Modal title={preview.name || "Bill preview"} onClose={() => setPreview(null)} xl>
          {preview.type === "application/pdf"
            ? <iframe src={preview.url} title="bill" style={{ width: "100%", height: "72vh", border: 0, borderRadius: 8, background: "#fff" }} />
            : <img src={preview.url} alt="bill" style={{ maxWidth: "100%", maxHeight: "72vh", margin: "0 auto", display: "block", borderRadius: 8 }} />}
          <div className="mt-3 text-right"><a href={preview.url} target="_blank" rel="noreferrer" style={{ color: T.teal }} className="text-xs font-medium">Open in new tab ↗</a></div>
        </Modal>
      )}
      {approveOpen && <ApprovalModal bills={bills} connections={connections} settings={settings} unidentifiedCount={unidentified.size} onConfirm={doApproveAll} onClose={() => setApproveOpen(false)} />}
    </React.Fragment>

}
function BillEditModal({ bill, connections, settings, onSave, onClose }) {

  const matched = connections.find((c) => normAcc(c.accountNumber) && normAcc(c.accountNumber) === normAcc(f.accountNumber));
  const addUse = () => set("extraUsages", [...f.extraUsages, { description: "", amount: "", category: "Staff chargeable" }]);

  const rmUse = (i) => set("extraUsages", f.extraUsages.filter((_, idx) => idx !== i));
  return (
    <Modal title={`${bill.provider} bill · ${mkLabel(bill.monthKey)}`} onClose={onClose} wide>

        <Field label="Invoice number"><input value={f.invoiceNumber} onChange={(e) => set("invoiceNumber", e.target.value)} style={inputStyle} className={inputCls} /></Field>
        <Field label="Invoice period"><input value={f.invoicePeriod} onChange={(e) => set("invoicePeriod", e.target.value)} style={inputStyle} className={inputCls} placeholder="e.g. 01–31 May 2026" /></Field>
      </div>
      {f.accountNumber && <div className="mt-2 text-xs" style={{ color: matched ? T.tealDk : T.amber }}>{matched ? `✓ Matches ${matched.userName} · ${matched.company} · ${matched.department}` : "No connection matches this account number (add it under Connections)"}</div>}
      <div className="grid grid-cols-3 gap-3 mt-3">

        </details>
      )}
    </Modal>
  );
}
function ApprovalModal({ bills, connections, settings, unidentifiedCount, onConfirm, onClose }) {
  const cur = settings.currency;
  const isId = (b) => { const n = normAcc(b.accountNumber); return !!n && connections.some((c) => normAcc(c.accountNumber) === n); };
  const pendingBills = bills.filter((b) => b.analysed && !b.approved && isId(b));
  const pending = pendingBills.map((b) => allocate(b, connections, settings));
  const notAnalysed = bills.filter((b) => !b.analysed).length;
  const unidentifiedPending = bills.filter((b) => b.analysed && !b.approved && !isId(b)).length;
  const sum = (k) => pending.reduce((s, x) => s + (x[k] || 0), 0);
  const rows = [
    ["Bills to approve (identified)", String(pending.length)],
    ["Basic rental", money(sum("basicRental"), cur)],
    ["Extra usage (Local calls & SMS)", money(sum("localSms"), cur)],
    ["Staff charges", money(sum("staff"), cur)],
    ["VAT", money(sum("vat"), cur)],
    ["Total committed", money(sum("total"), cur)],
  ];
  return (
    <Modal title="Approve all costs" onClose={onClose}>
      <p className="text-[13px]" style={{ color: T.sub }}>
        This approves and commits <b>{pending.length}</b> identified bill(s) to expenses. Approved costs become final billed costs in the dashboard and reports.
      </p>
      <div className="mt-4 rounded-lg" style={{ border: `1px solid ${T.line}` }}>
        {rows.map(([k, v], i) => (

function buildReport(type, ctx) {
  const { rows, connections, settings, range, compBy } = ctx;
  const cur = settings.currency;
  const M = (n) => money(n, cur);
  const sum = (arr, k) => arr.reduce((s, x) => s + (x[k] || 0), 0);

  if (type === "finance") {
    const head = ["S/N", "Account #", "User", "Company", "Department", "Month", "Basic Rental", "Extra Usage (Local Calls & SMS)", "Staff Charges", "Other Credits", "VAT", "Total"];
    const body = rows.map((a, i) => [i + 1, a.accountNumber, a.user, a.company, a.department, mkLabel(a.month), M(a.basicRental), M(a.localSms), M(a.staff), M(a.otherCredits), M(a.vat), M(a.total)]);
    const totalRow = ["", "", "", "", "", "TOTAL", M(sum(rows, "basicRental")), M(sum(rows, "localSms")), M(sum(rows, "staff")), M(sum(rows, "otherCredits")), M(sum(rows, "vat")), M(sum(rows, "total"))];
    totalRow._total = true; body.push(totalRow);
    const byCo = {}; rows.forEach((a) => (byCo[a.company] = (byCo[a.company] || 0) + a.companyCost));
    const allocHead = ["Company", "Allocated Cost (company-borne)"];
    const allocBody = Object.entries(byCo).sort((a, b) => b[1] - a[1]).map(([c, v]) => [c, M(v)]);
    const at = ["TOTAL", M(Object.values(byCo).reduce((s, v) => s + v, 0))]; at._total = true; allocBody.push(at);
    return { title: "Finance & Cost Allocation", sheets: [{ name: "Finance & Cost Allocation", head, body }, { name: "Company Allocation", head: allocHead, body: allocBody }] };
  }
  if (type === "package") {
    const head = ["S/N", "Account #", "User", "Company", "Department", "Provider", "Basic Rent", "Eligibilities", "Subtotal", "VAT", "Total Value", "Initiated", "Status"];
    const body = connections.map((c) => {
      const t = connTotals(c);
      const elig = (c.eligibilities || []).map((e) => `${e.name}: ${num(e.amount)}`).join("; ");
      return [c.sn, c.accountNumber, c.userName, c.company, c.department, c.provider, M(t.base), elig || "—", M(t.sub), M(t.vat), M(t.total), c.initiatedDate || "—", c.status === "cancelled" ? "Cancelled" : "Active"];
    });
    return { title: "Basic Package Detail", sheets: [{ name: "Package Detail", head, body }] };
  }
  if (type === "comparison") {
    const months = [...new Set(rows.map((a) => a.month))].sort();
    const keyFn = { company: (a) => a.company, user: (a) => a.user, account: (a) => a.accountNumber, period: (a) => a.month }[compBy];
    if (compBy === "period") {
      const head = ["Period", "Basic Rental", "Extra Usage", "Staff Charges", "VAT", "Total"];
      const body = months.map((mk) => { const g = rows.filter((a) => a.month === mk); return [mkLabel(mk), M(sum(g, "basicRental")), M(sum(g, "localSms")), M(sum(g, "staff")), M(sum(g, "vat")), M(sum(g, "total"))]; });
      const tr = ["TOTAL", M(sum(rows, "basicRental")), M(sum(rows, "localSms")), M(sum(rows, "staff")), M(sum(rows, "vat")), M(sum(rows, "total"))]; tr._total = true; body.push(tr);
      return { title: "Monthly Comparison (Period)", sheets: [{ name: "Comparison by Period", head, body }] };
    }
    const dims = [...new Set(rows.map(keyFn))];
    const head = [compBy === "company" ? "Company" : compBy === "user" ? "User" : "Account", ...months.map(mkLabel), "Total"];
    const body = dims.map((d) => { const cells = months.map((mk) => sum(rows.filter((a) => keyFn(a) === d && a.month === mk), "total")); return [d, ...cells.map(M), M(cells.reduce((s, v) => s + v, 0))]; });
    const totalCells = months.map((mk) => sum(rows.filter((a) => a.month === mk), "total"));
    const tr = ["TOTAL", ...totalCells.map(M), M(totalCells.reduce((s, v) => s + v, 0))]; tr._total = true; body.push(tr);
    return { title: `Monthly Comparison (${compBy})`, sheets: [{ name: `Comparison by ${compBy}`, head, body }] };
  }
  if (type === "summary") {
    const head = ["S/N", "Account #", "User", "Company", "Department", "Bills", "Basic Rental", "Extra Usage", "Staff Charges", "VAT", "Total"];
    const byAcc = {};
    rows.forEach((a) => { const k = a.accountNumber || a.user; byAcc[k] = byAcc[k] || { ...a, count: 0, basicRental: 0, localSms: 0, staff: 0, vat: 0, total: 0 }; const o = byAcc[k]; o.count++; o.basicRental += a.basicRental; o.localSms += a.localSms; o.staff += a.staff; o.vat += a.vat; o.total += a.total; });
    const body = Object.values(byAcc).map((a, i) => [i + 1, a.accountNumber, a.user, a.company, a.department, a.count, M(a.basicRental), M(a.localSms), M(a.staff), M(a.vat), M(a.total)]);
    const tr = ["", "", "", "", "TOTAL", sum(Object.values(byAcc), "count"), M(sum(rows, "basicRental")), M(sum(rows, "localSms")), M(sum(rows, "staff")), M(sum(rows, "vat")), M(sum(rows, "total"))]; tr._total = true; body.push(tr);
    return { title: "User / Account Summary", sheets: [{ name: "User Account Summary", head, body }] };
  }
  if (type === "staff") {
    const head = ["S/N", "Account #", "User", "Usage Charge Details", "Month", "Amount"];
    let i = 0; const body = [];
    rows.forEach((a) => (a.staffLines || []).forEach((l) => { if (num(l.amount)) body.push([++i, a.accountNumber, a.user, l.description, mkLabel(a.month), M(num(l.amount))]); }));
    if (body.length) { const tot = body.reduce((s, r) => s + num(String(r[5]).replace(/[^\d.-]/g, "")), 0); const tr = ["", "", "", "", "TOTAL", M(tot)]; tr._total = true; body.push(tr); }
    return { title: "Staff Charge Detail (for HR approval)", sheets: [{ name: "Staff Charge Detail", head, body }] };
  }
  if (type === "unidentified") {
    const u = rows.filter((r) => !r.conn && String(r.accountNumber || "").trim());
    const head = ["S/N", "Account #", "Provider", "Month", "Invoice #", "Rental", "Extra Usage (Local)", "Staff Charges", "VAT", "Total", "Note"];
    const body = u.map((a, i) => [i + 1, a.accountNumber, a.provider, mkLabel(a.month), a.invoiceNumber || "—", M(a.basicRental), M(a.localSms), M(a.staff), M(a.vat), M(a.total), "Not in Connections page"]);
    if (body.length) { const tr = ["", "", "", "", "TOTAL", "", "", "", "", M(sum(u, "total")), ""]; tr._total = true; body.push(tr); }
    return { title: "Unidentified Accounts", sheets: [{ name: "Unidentified Accounts", head, body }] };
  }
  return { title: "Report", sheets: [{ name: "Report", head: [], body: [] }] };
}
function printReport(data, settings, range) {
  const style = `body{font-family:Arial,Helvetica,sans-serif;color:#12212B;padding:28px;font-size:12px}h1{font-size:18px;margin:0 0 4px}.meta{color:#5C6E74;font-size:11px;margin-bottom:16px}h2{font-size:13px;margin:22px 0 6px;color:#0E7A69}table{width:100%;border-collapse:collapse;margin-bottom:12px}th,td{border:1px solid #E1E7E7;padding:5px 7px;text-align:left;white-space:nowrap}th{background:#F3F5F4;font-size:10px;color:#5C6E74}tr.total td{font-weight:700;background:#F3F5F4}@media print{@page{size:landscape;margin:12mm}}`;
  const sheetHtml = data.sheets.map((s) => `<h2>${s.name}</h2><table><thead><tr>${s.head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${s.body.map((row) => { const cells = Array.isArray(row) ? row : Object.values(row); return `<tr class="${row._total ? "total" : ""}">${cells.map((c) => `<td>${c ?? ""}</td>`).join("")}</tr>`; }).join("")}</tbody></table>`).join("");
  const html = `<html><head><title>${data.title}</title><style>${style}</style></head><body><h1>${data.title}</h1><div class="meta">${settings.orgName || ""} · Period ${range.from} to ${range.to} · Generated ${new Date().toLocaleDateString()}</div>${sheetHtml}<script>window.onload=function(){window.print()}<\/script></body></html>`;
  const w = window.open("", "_blank");
  if (w) { w.document.write(html); w.document.close(); }
  else { const blob = new Blob([html], { type: "text/html" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${data.title}.html`; a.click(); }
}

              {billMatches.length === 0 ? <div className="px-5 py-6 text-xs text-center" style={{ color: T.sub }}>No matching bills.</div> : (

}
