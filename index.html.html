/* ============================== PAYMENTS / RECEIPTS ============================== */
function Payments({ bills, receipts, saveReceipts, connections, settings, flash }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const [provider, setProvider] = useState("Etisalat");
  const [amount, setAmount] = useState("");
  const [refNo, setRefNo] = useState("");
  const [payDate, setPayDate] = useState("");
  const fileRef = useRef();
  const cur = settings.currency || "AED";
  const mk = monthKey(year, month);
  const years = [];
  for (let y = now.getFullYear() + 1; y >= now.getFullYear() - 6; y--) years.push(y);

  const invoicedFor = (mkey, prov) => bills.filter((b) => b.monthKey === mkey && b.analysed && (!prov || b.provider === prov)).reduce((s, b) => s + (allocate(b, connections, settings).total || 0), 0);
  const paidFor = (mkey, prov) => receipts.filter((r) => r.monthKey === mkey && (!prov || r.provider === prov)).reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);

  const monthReceipts = receipts.filter((r) => r.monthKey === mk).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const inv = invoicedFor(mk), paid = paidFor(mk), diff = +(inv - paid).toFixed(2);
  const diffColor = Math.abs(diff) < 0.01 ? T.green : diff > 0 ? T.red : "#2E6DB4";
  const diffLabel = Math.abs(diff) < 0.01 ? "Fully settled" : diff > 0 ? "Outstanding (to pay)" : "Overpaid";

  const addReceipt = async () => {
    if (!amount || parseFloat(amount) <= 0) { flash("Enter the payment amount"); return; }
    let storagePath = null, fileName = "", fileType = "", size = 0;
    const id = uid();
    const file = fileRef.current && fileRef.current.files && fileRef.current.files[0];
    if (file) {
      const okType = file.type === "application/pdf" || file.type.startsWith("image/");
      if (!okType) { flash("Only PDF / image receipts"); return; }
      fileName = file.name; fileType = file.type; size = file.size;
      try {
        const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
        storagePath = await uploadToStorage(id, dataUrl, file.type);
      } catch (e) { console.error(e); flash("Receipt upload failed"); return; }
    }
    const rec = { id, monthKey: mk, provider, amount: parseFloat(amount), reference: refNo.trim(), payDate: payDate || null, fileName, fileType, size, storagePath, createdAt: Date.now() };
    saveReceipts([...receipts, rec]);
    setAmount(""); setRefNo(""); setPayDate(""); if (fileRef.current) fileRef.current.value = "";
    flash("Receipt added");
  };
  const removeReceipt = (id) => { if (confirm("Remove this receipt?")) { saveReceipts(receipts.filter((r) => r.id !== id)); flash("Removed"); } };
  const viewReceipt = async (r) => { const url = r.storagePath ? await fileSignedUrl(r.storagePath) : r.base64; if (url) window.open(url, "_blank"); else alert("No file stored."); };

  const allMonths = useMemo(() => { const set = new Set([...bills.map((b) => b.monthKey), ...receipts.map((r) => r.monthKey)].filter(Boolean)); return Array.from(set).sort().reverse(); }, [bills, receipts]);

  const exportOverview = () => {
    const head = ["Month", `Invoiced (${cur})`, `Paid (${cur})`, `Difference (${cur})`, "Status"];
    const body = allMonths.map((m) => { const i = invoicedFor(m), p = paidFor(m), d = +(i - p).toFixed(2); return [mkLabel(m), i.toFixed(2), p.toFixed(2), d.toFixed(2), Math.abs(d) < 0.01 ? "Settled" : d > 0 ? "Outstanding" : "Overpaid"]; });
    const ti = allMonths.reduce((s, m) => s + invoicedFor(m), 0), tp = allMonths.reduce((s, m) => s + paidFor(m), 0);
    body.push(["TOTAL", ti.toFixed(2), tp.toFixed(2), (ti - tp).toFixed(2), ""]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...body]), "Reconciliation");
    XLSX.writeFile(wb, "payments-reconciliation.xlsx");
  };

  const KPI = ({ label, value, color }) => (
    <div style={{ background: T.card, border: `1px solid ${T.line}` }} className="rounded-xl p-4 flex-1 min-w-[150px]">
      <div style={{ color: T.sub }} className="text-xs">{label}</div>
      <div className="text-xl font-semibold mt-1" style={{ color: color || T.text }}>{money(value, cur)}</div>
    </div>
  );

  return (
    <React.Fragment>
      <PageHeader title="Payments &amp; Receipts" subtitle="Upload payment receipts per month and reconcile them against the invoiced totals">
        <Btn variant="ghost" size="sm" onClick={exportOverview}><Download size={13} /> Export reconciliation</Btn>
      </PageHeader>
      <div className="p-8 space-y-6">
        {/* period + reconciliation */}
        <Card className="p-5">
          <div className="flex flex-wrap gap-3 items-end">
            <Field label="Year"><select value={year} onChange={(e) => setYear(+e.target.value)} style={inputStyle} className={inputCls}>{years.map((y) => <option key={y} value={y}>{y}</option>)}</select></Field>
            <Field label="Month"><select value={month} onChange={(e) => setMonth(+e.target.value)} style={inputStyle} className={inputCls}>{MONTHS.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}</select></Field>
            <div style={{ color: T.sub }} className="text-xs pb-2">Reconciling <b>{mkLabel(mk)}</b></div>
          </div>
          <div className="flex flex-wrap gap-3 mt-4">
            <KPI label="Total invoiced (analysed bills)" value={inv} />
            <KPI label="Total paid (receipts)" value={paid} color={T.tealDk} />
            <div style={{ background: diffColor + "12", border: `1px solid ${diffColor}40` }} className="rounded-xl p-4 flex-1 min-w-[150px]">
              <div style={{ color: diffColor }} className="text-xs font-medium">{diffLabel}</div>
              <div className="text-xl font-semibold mt-1" style={{ color: diffColor }}>{money(Math.abs(diff), cur)}</div>
            </div>
          </div>
          <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
            {["Etisalat", "DU"].map((pv) => { const i = invoicedFor(mk, pv), p = paidFor(mk, pv), d = +(i - p).toFixed(2); return (
              <div key={pv} style={{ border: `1px solid ${T.line}` }} className="rounded-lg p-3 text-[13px]">
                <div className="flex items-center gap-2 mb-1"><ProviderTag p={pv} /></div>
                <div className="flex justify-between"><span style={{ color: T.sub }}>Invoiced</span><span>{money(i, cur)}</span></div>
                <div className="flex justify-between"><span style={{ color: T.sub }}>Paid</span><span>{money(p, cur)}</span></div>
                <div className="flex justify-between font-medium"><span>Difference</span><span style={{ color: Math.abs(d) < 0.01 ? T.green : d > 0 ? T.red : "#2E6DB4" }}>{money(d, cur)}</span></div>
              </div>
            ); })}
          </div>
        </Card>

        {/* add receipt */}
        <Card className="p-5">
          <div className="font-medium mb-3">Add a payment receipt for {mkLabel(mk)}</div>
          <div className="flex flex-wrap gap-3 items-end">
            <Field label="Provider"><select value={provider} onChange={(e) => setProvider(e.target.value)} style={inputStyle} className={inputCls}><option>Etisalat</option><option>DU</option></select></Field>
            <Field label={`Amount paid (${cur})`}><input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} style={inputStyle} className={inputCls} placeholder="0.00" /></Field>
            <Field label="Payment date"><input type="date" value={payDate} onChange={(e) => setPayDate(e.target.value)} style={inputStyle} className={inputCls} /></Field>
            <Field label="Reference / note"><input value={refNo} onChange={(e) => setRefNo(e.target.value)} style={inputStyle} className={inputCls} placeholder="e.g. bank ref, cheque #" /></Field>
            <Field label="Receipt file (optional)"><input ref={fileRef} type="file" accept="application/pdf,image/*" className="text-xs" /></Field>
            <div className="pb-1"><Btn onClick={addReceipt}><Upload size={14} /> Add receipt</Btn></div>
          </div>
        </Card>

        {/* receipts list */}
        <Card>
          <div className="px-5 py-3 flex items-center gap-2" style={{ borderBottom: `1px solid ${T.line}` }}>
            <Receipt size={15} style={{ color: T.teal }} /><span className="font-medium">Receipts · {mkLabel(mk)}</span>
            <span style={{ color: T.sub }} className="text-xs">· {monthReceipts.length} receipt(s) · {money(paid, cur)} total</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-[13px]">
              <thead><tr style={{ borderBottom: `1px solid ${T.line}`, color: T.sub }} className="text-left text-xs">
                {["Provider", "Amount", "Date", "Reference", "Receipt", ""].map((h) => <th key={h} className="px-4 py-2.5 font-medium whitespace-nowrap">{h}</th>)}
              </tr></thead>
              <tbody>
                {monthReceipts.map((r) => (
                  <tr key={r.id} style={{ borderBottom: `1px solid ${T.line}` }}>
                    <td className="px-4 py-2.5"><ProviderTag p={r.provider} /></td>
                    <td className="px-4 py-2.5 font-medium">{money(r.amount, cur)}</td>
                    <td className="px-4 py-2.5 whitespace-nowrap" style={{ color: T.sub }}>{r.payDate || "—"}</td>
                    <td className="px-4 py-2.5">{r.reference || "—"}</td>
                    <td className="px-4 py-2.5">{r.fileName ? <button onClick={() => viewReceipt(r)} style={{ color: T.teal }} className="underline text-xs">{r.fileName.length > 22 ? r.fileName.slice(0, 20) + "…" : r.fileName}</button> : <span style={{ color: T.sub }} className="text-xs">—</span>}</td>
                    <td className="px-4 py-2.5 text-right"><button title="Remove" onClick={() => removeReceipt(r.id)} className="p-1.5 rounded" style={{ color: T.red }}><Trash2 size={15} /></button></td>
                  </tr>
                ))}
                {monthReceipts.length === 0 && <tr><td colSpan={6} className="px-4 py-8 text-center text-sm" style={{ color: T.sub }}>No receipts for {mkLabel(mk)} yet.</td></tr>}
              </tbody>
            </table>
          </div>
        </Card>

        {/* all-month overview */}
        <Card>
          <div className="px-5 py-3 flex items-center gap-2" style={{ borderBottom: `1px solid ${T.line}` }}><FileBarChart size={15} style={{ color: T.teal }} /><span className="font-medium">Reconciliation — all months</span></div>
          <div className="overflow-x-auto">
            <table className="w-full text-[13px]">
              <thead><tr style={{ borderBottom: `1px solid ${T.line}`, color: T.sub }} className="text-left text-xs">
                {["Month", "Invoiced", "Paid", "Difference", "Status"].map((h) => <th key={h} className="px-4 py-2.5 font-medium whitespace-nowrap">{h}</th>)}
              </tr></thead>
              <tbody>
                {allMonths.map((m) => { const i = invoicedFor(m), p = paidFor(m), d = +(i - p).toFixed(2); const c = Math.abs(d) < 0.01 ? T.green : d > 0 ? T.red : "#2E6DB4"; return (
                  <tr key={m} style={{ borderBottom: `1px solid ${T.line}`, cursor: "pointer" }} onClick={() => { const { y, m: mm } = parseMK(m); setYear(y); setMonth(mm); }}>

                  </tr>
                ); })}
                {allMonths.length === 0 && <tr><td colSpan={5} className="px-4 py-8 text-center text-sm" style={{ color: T.sub }}>No data yet.</td></tr>}

/* ============================== MONTHLY VERIFICATION ============================== */
function MonthlyPage({ bills, connections, settings, saveBills, flash }) {
  const cur = settings.currency || "AED";
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const years = []; for (let y = now.getFullYear() + 1; y >= now.getFullYear() - 6; y--) years.push(y);
  const mk = monthKey(year, month);
  const isId = (b) => { const n = normAcc(b.accountNumber); return !!n && connections.some((c) => normAcc(c.accountNumber) === n); };
  const allocFor = (arr) => arr.filter((b) => b.analysed).reduce((a, b) => { const x = allocate(b, connections, settings); a.total += x.total || 0; a.vat += x.vat || 0; a.rental += x.basicRental || 0; return a; }, { total: 0, vat: 0, rental: 0 });

  const monthBills = useMemo(() => bills.filter((b) => b.monthKey === mk), [bills, mk]);
  const duBills = monthBills.filter((b) => b.provider === "DU");
  const etBills = monthBills.filter((b) => b.provider !== "DU");
  const allA = allocFor(monthBills), duA = allocFor(duBills), etA = allocFor(etBills);
  const analysed = monthBills.filter((b) => b.analysed).length;
  const approved = monthBills.filter((b) => b.approved).length;
  const unidentified = monthBills.filter((b) => b.analysed && !isId(b)).length;
  const pendingApprove = monthBills.filter((b) => b.analysed && !b.approved && isId(b)).length;
  const notAnalysed = monthBills.length - analysed;
  const ready = monthBills.length > 0 && notAnalysed === 0 && unidentified === 0;
  const verified = monthBills.length > 0 && approved === monthBills.length && unidentified === 0;

  const prevD = new Date(year, month - 2, 1); const pmk = monthKey(prevD.getFullYear(), prevD.getMonth() + 1);
  const prevTotal = allocFor(bills.filter((b) => b.monthKey === pmk)).total;
  const delta = prevTotal ? ((allA.total - prevTotal) / prevTotal * 100) : null;

  const byCompany = useMemo(() => { const m = {}; monthBills.filter((b) => b.analysed).forEach((b) => { const x = allocate(b, connections, settings); const co = isId(b) ? (x.company || "—") : "Unidentified"; m[co] = (m[co] || 0) + (x.total || 0); }); return Object.entries(m).map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total); }, [monthBills, connections, settings]);

  const approveMonth = () => {
    const n = monthBills.filter((b) => b.analysed && !b.approved && isId(b)).length;
    if (!n) { flash("Nothing to approve for this month"); return; }
    if (!confirm(`Approve ${n} identified bill(s) for ${mkLabel(mk)}?\n\nThis confirms the month's invoice total of ${money(allA.total, cur)}.`)) return;
    saveBills(bills.map((b) => (b.monthKey === mk && b.analysed && !b.approved && isId(b) ? { ...b, approved: true, approvedAt: b.approvedAt || Date.now() } : b)));
    flash(`Approved ${n} bill(s) for ${mkLabel(mk)}`);
  };

  const allMonths = useMemo(() => { const set = new Set(bills.map((b) => b.monthKey).filter(Boolean)); return Array.from(set).sort().reverse(); }, [bills]);
  const pie = [T.teal, T.blue, T.amber, T.green, T.tealDk, T.red];

  return (
    <React.Fragment>
      <PageHeader title="Monthly Verify" subtitle="Check each month's invoice total, confirm all bills are analysed, then approve — before payment set-off">
        <Btn onClick={approveMonth} disabled={pendingApprove === 0}><Check size={15} /> Approve month ({pendingApprove})</Btn>
      </PageHeader>
      <div className="p-8 space-y-5">
        <Card className="p-5">
          <div className="flex flex-wrap gap-3 items-end">
            <Field label="Year"><select value={year} onChange={(e) => setYear(+e.target.value)} style={inputStyle} className={inputCls}>{years.map((y) => <option key={y} value={y}>{y}</option>)}</select></Field>
            <Field label="Month"><select value={month} onChange={(e) => setMonth(+e.target.value)} style={inputStyle} className={inputCls}>{MONTHS.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}</select></Field>
            <div className="pb-2 text-xs" style={{ color: T.sub }}>Verifying <b>{mkLabel(mk)}</b></div>
            <div className="ml-auto pb-1">
              {verified ? <span style={{ background: T.green + "18", color: T.green }} className="px-3 py-1.5 rounded-lg text-xs font-semibold">✓ Month verified & approved</span>
                : ready ? <span style={{ background: T.teal + "18", color: T.tealDk }} className="px-3 py-1.5 rounded-lg text-xs font-semibold">Ready to approve</span>
                : <span style={{ background: T.amber + "20", color: T.amber }} className="px-3 py-1.5 rounded-lg text-xs font-semibold">Needs attention</span>}
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mt-4">
            <div style={{ background: T.teal + "10", border: `1px solid ${T.teal}30` }} className="rounded-xl p-4">
              <div style={{ color: T.sub }} className="text-xs">Total invoiced — {mkLabel(mk)}</div>
              <div className="text-2xl font-semibold mt-1" style={{ color: T.tealDk }}>{money(allA.total, cur)}</div>
              {delta != null && <div className="text-xs mt-1" style={{ color: delta > 0 ? T.red : T.green }}>{delta > 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(1)}% vs prev month</div>}
            </div>
            <Kpi label="DU total" value={duA.total} accent={T.blue} small />
            <Kpi label="Etisalat total" value={etA.total} accent={T.green} small />
            <Kpi label="VAT (month)" value={allA.vat} accent={T.amber} small />
          </div>
        </Card>

        <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
          <StatChip label="Bills this month" val={monthBills.length} color={T.sub} />
          <StatChip label="Analysed" val={`${analysed}/${monthBills.length}`} color={notAnalysed ? T.amber : T.green} />
          <StatChip label="Unidentified" val={unidentified} color={unidentified ? T.red : T.green} />
          <StatChip label="Pending approval" val={pendingApprove} color={pendingApprove ? T.amber : T.green} />
        </div>
        {(notAnalysed > 0 || unidentified > 0) && (
          <div style={{ background: T.amberSoft, border: `1px solid ${T.amber}40` }} className="rounded-xl px-4 py-3 text-[13px]">
            {notAnalysed > 0 && <div>• {notAnalysed} bill(s) not analysed yet — run <b>Analyse all</b> in the Analysis tab.</div>}
            {unidentified > 0 && <div>• {unidentified} unidentified account(s) — add the connection in the Analysis tab so the total is complete.</div>}

          {byCompany.length === 0 ? <div style={{ color: T.sub }} className="text-sm">No analysed bills for this month.</div> : (

                  const et = allocFor(mb.filter((b) => b.provider !== "DU")).total;
                  const tot = du + et;
                  const uid = mb.filter((b) => b.analysed && !isId(b)).length;
                  const appr = mb.filter((b) => b.approved).length;

/* ============================== REVIEW (dormant connections) ============================== */
function ReviewPage({ connections, bills, saveConn, settings, flash, reload }) {
  const cur = settings.currency || "AED";
  const [showAck, setShowAck] = useState(false);
  const [sel, setSel] = useState(new Set());
  const [busy, setBusy] = useState(false);
  const cutoff = useMemo(() => { const d = new Date(); d.setMonth(d.getMonth() - 3); return monthKey(d.getFullYear(), d.getMonth() + 1); }, []);
  const sixAgo = Date.now() - 182 * 864e5;
  const lastByAcc = useMemo(() => {
    const m = {};
    bills.forEach((b) => { const a = normAcc(b.accountNumber); if (!a) return; const mk = b.monthKey || ""; if (!m[a] || mk > m[a]) m[a] = mk; });
    return m;
  }, [bills]);
  const monthsSince = (mk) => { if (!mk) return null; const [y, m] = mk.split("-").map(Number); const now = new Date(); return (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m); };

  const dormant = useMemo(() => connections.filter((c) => {
    if ((c.status || "active") !== "active") return false;
    const a = normAcc(c.accountNumber); if (!a) return false;
    const last = lastByAcc[a] || "";
    if (last && last >= cutoff) return false;
    if (c.dormantReviewedAt && new Date(c.dormantReviewedAt).getTime() > sixAgo) return false;
    return true;
  }).map((c) => ({ c, last: lastByAcc[normAcc(c.accountNumber)] || "" })), [connections, bills, cutoff]);

  const acknowledged = useMemo(() => connections.filter((c) => (c.status || "active") === "active" && c.dormantReviewedAt && new Date(c.dormantReviewedAt).getTime() > sixAgo)
    .map((c) => ({ c, last: lastByAcc[normAcc(c.accountNumber)] || "" })), [connections, bills]);

  const keepActive = (c) => { saveConn(connections.map((x) => x.id === c.id ? { ...x, dormantReviewedAt: new Date().toISOString() } : x)); flash("Kept active — won't alert again for 6 months"); };
  const cancelConn = (c) => { if (!confirm(`Cancel connection ${c.accountNumber} (${c.userName || ""})?`)) return; saveConn(connections.map((x) => x.id === c.id ? { ...x, status: "cancelled", cancellation: { reason: "No activity for 3+ months", date: new Date().toISOString().slice(0, 10) } } : x)); flash("Connection cancelled"); };
  const unsnooze = (c) => { saveConn(connections.map((x) => x.id === c.id ? { ...x, dormantReviewedAt: null } : x)); flash("Back in the review list"); };

  const toggle = (id) => setSel((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const allSelected = dormant.length > 0 && dormant.every((it) => sel.has(it.c.id));
  const toggleAll = () => setSel(allSelected ? new Set() : new Set(dormant.map((it) => it.c.id)));
  const selIds = () => new Set([...sel].filter((id) => dormant.some((it) => it.c.id === id)));
  const bulkKeep = () => { const ids = selIds(); if (!ids.size) return; saveConn(connections.map((x) => ids.has(x.id) ? { ...x, dormantReviewedAt: new Date().toISOString() } : x)); setSel(new Set()); flash(`${ids.size} connection(s) kept active`); };
  const bulkCancel = () => { const ids = selIds(); if (!ids.size) return; if (!confirm(`Cancel ${ids.size} selected connection(s)?`)) return; saveConn(connections.map((x) => ids.has(x.id) ? { ...x, status: "cancelled", cancellation: { reason: "No activity for 3+ months", date: new Date().toISOString().slice(0, 10) } } : x)); setSel(new Set()); flash(`${ids.size} connection(s) cancelled`); };
  const doRefresh = async () => { setBusy(true); setSel(new Set()); if (reload) await reload(); setBusy(false); };

  const Row = ({ item, ack }) => {
    const { c, last } = item; const ms = monthsSince(last);
    return (
      <tr style={{ borderBottom: `1px solid ${T.line}` }}>
        {!ack && <td className="pl-4 py-2.5"><input type="checkbox" checked={sel.has(c.id)} onChange={() => toggle(c.id)} /></td>}
        <td className="px-4 py-2.5 font-medium">{c.accountNumber}</td>
        <td className="px-4 py-2.5">{c.userName || "—"}</td>
        <td className="px-4 py-2.5">{c.company || "—"}</td>
        <td className="px-4 py-2.5"><ProviderTag p={c.provider} /></td>
        <td className="px-4 py-2.5 whitespace-nowrap" style={{ color: T.sub }}>{last ? `${mkLabel(last)}${ms != null ? ` · ${ms} mo ago` : ""}` : "No bills ever"}</td>
        <td className="px-4 py-2.5 text-right whitespace-nowrap">
          {ack ? (
            <Btn size="sm" variant="ghost" onClick={() => unsnooze(c)}><History size={13} /> Re-review</Btn>
          ) : (
            <div className="flex gap-2 justify-end">
              <Btn size="sm" variant="ghost" onClick={() => keepActive(c)}><Check size={13} /> Keep active</Btn>
              <Btn size="sm" variant="dark" onClick={() => cancelConn(c)}><Ban size={13} /> Cancel</Btn>
            </div>
          )}
        </td>
      </tr>
    );
  };

  return (
    <React.Fragment>
      <PageHeader title="Review" subtitle="Active connections with no bill / transaction for more than 3 months — keep them or cancel them">
        <Btn variant="ghost" size="sm" onClick={doRefresh} disabled={busy}>{busy ? <Loader2 size={13} className="animate-spin" /> : <History size={13} />} Refresh</Btn>
      </PageHeader>
      <div className="p-8 space-y-5">
        {sel.size > 0 && (
          <div style={{ background: T.tealSoft + "80", border: `1px solid ${T.line}` }} className="rounded-xl px-4 py-2.5 flex items-center gap-3">
            <span className="text-[13px] font-medium">{selIds().size} selected</span>
            <div className="flex gap-2 ml-auto">
              <Btn size="sm" variant="ghost" onClick={bulkKeep}><Check size={13} /> Keep active</Btn>
              <Btn size="sm" variant="dark" onClick={bulkCancel}><Ban size={13} /> Cancel</Btn>
              <Btn size="sm" variant="ghost" onClick={() => setSel(new Set())}>Clear</Btn>
            </div>
          </div>
        )}
        <Card>
          <div className="px-5 py-3 flex items-center gap-2" style={{ borderBottom: `1px solid ${T.line}` }}>
            <Review size={15} style={{ color: T.amber }} />
            <span className="font-medium">Needs review</span>
            <span style={{ color: T.sub }} className="text-xs">· {dormant.length} dormant connection(s)</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-[13px]">
              <thead><tr style={{ borderBottom: `1px solid ${T.line}`, color: T.sub }} className="text-left text-xs">
                <th className="pl-4 py-2.5">{dormant.length > 0 && <input type="checkbox" checked={allSelected} onChange={toggleAll} />}</th>
                {["Account #", "User", "Company", "Provider", "Last activity", ""].map((h) => <th key={h} className="px-4 py-2.5 font-medium whitespace-nowrap">{h}</th>)}
              </tr></thead>
              <tbody>
                {dormant.map((it) => <Row key={it.c.id} item={it} />)}
                {dormant.length === 0 && <tr><td colSpan={7} className="px-4 py-8 text-center text-sm" style={{ color: T.sub }}>Nothing to review — all active connections have recent activity or have been reviewed. 🎉</td></tr>}
              </tbody>
            </table>
          </div>
        </Card>

        {acknowledged.length > 0 && (
          <div>
            <button onClick={() => setShowAck(!showAck)} className="text-xs flex items-center gap-1.5" style={{ color: T.sub }}>
              <ChevronRight size={13} style={{ transform: showAck ? "rotate(90deg)" : "none", transition: "transform .15s" }} />
              {acknowledged.length} connection(s) kept active (snoozed)
            </button>
            {showAck && (
              <Card className="mt-2">
                <div className="overflow-x-auto">
                  <table className="w-full text-[13px]">
                    <thead><tr style={{ borderBottom: `1px solid ${T.line}`, color: T.sub }} className="text-left text-xs">
                      {["Account #", "User", "Company", "Provider", "Last activity", ""].map((h) => <th key={h} className="px-4 py-2.5 font-medium whitespace-nowrap">{h}</th>)}
                    </tr></thead>
                    <tbody>{acknowledged.map((it) => <Row key={it.c.id} item={it} ack />)}</tbody>
                  </table>
                </div>
              </Card>
            )}
          </div>
        )}

        <p className="text-xs" style={{ color: T.sub }}>
          "Keep active" stops the weekly reminder email for that connection for 6 months. "Cancel" marks it cancelled. Sujitha also receives this list by email every Monday.
        </p>
      </div>
    </React.Fragment>
  );
}

/* ============================== ACTIVITY LOG ============================== */
function ActivityLog({ supabase }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState("");
  const load = async () => {
    setLoading(true);
    try { const { data } = await supabase.from("activity_log").select("*").order("at", { ascending: false }).limit(500); setRows(data || []); }
    catch (e) { console.error(e); }
    setLoading(false);
  };
  useEffect(() => {
    load();
    const ch = supabase.channel("act").on("postgres_changes", { event: "INSERT", schema: "public", table: "activity_log" }, (p) => { setRows((r) => [p.new, ...r].slice(0, 500)); }).subscribe();
    return () => supabase.removeChannel(ch);
  }, []);
  const fmt = (t) => { try { return new Date(t).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch { return t; } };
  const filtered = rows.filter((r) => { if (!q.trim()) return true; const s = q.toLowerCase(); return [r.user_email, r.action, r.detail].some((v) => String(v || "").toLowerCase().includes(s)); });
  const tagColor = (a) => a === "Bills" ? T.tealDk : a === "Connections" ? "#2E6DB4" : a === "Backup" ? T.amber : T.sub;
  return (
    <React.Fragment>
      <PageHeader title="Activity Log" subtitle="Every change made by any user — who did what, and when">
        <Btn variant="ghost" size="sm" onClick={load} disabled={loading}>{loading ? <Loader2 size={13} className="animate-spin" /> : <History size={13} />} Refresh</Btn>
      </PageHeader>
      <div className="p-8 space-y-4">
        <div className="relative max-w-sm">
          <Search size={15} style={{ color: T.sub }} className="absolute left-3 top-1/2 -translate-y-1/2" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter by user, action or detail…" style={{ ...inputStyle, paddingLeft: 34 }} className={inputCls} />
        </div>
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full text-[13px]">
              <thead>
                <tr style={{ borderBottom: `1px solid ${T.line}`, color: T.sub }} className="text-left text-xs">
                  {["When", "User", "Area", "What changed"].map((h) => <th key={h} className="px-4 py-2.5 font-medium whitespace-nowrap">{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {filtered.map((r) => (
                  <tr key={r.id} style={{ borderBottom: `1px solid ${T.line}` }}>
                    <td className="px-4 py-2.5 whitespace-nowrap" style={{ color: T.sub }}>{fmt(r.at)}</td>
                    <td className="px-4 py-2.5 whitespace-nowrap font-medium">{r.user_email}</td>
                    <td className="px-4 py-2.5"><span style={{ background: tagColor(r.action) + "18", color: tagColor(r.action) }} className="px-2 py-0.5 rounded text-[11px] font-medium">{r.action}</span></td>
                    <td className="px-4 py-2.5">{r.detail}</td>
                  </tr>
                ))}
                {!loading && filtered.length === 0 && <tr><td colSpan={4} className="px-4 py-8 text-center text-sm" style={{ color: T.sub }}>No activity yet.</td></tr>}
              </tbody>
            </table>
          </div>
        </Card>
      </div>
    </React.Fragment>
  );
}

function ConfigScreen({ onSave }) {

    <AuthCard title="Connect to your workspace" sub="One-time setup. Paste your Supabase Project URL and anon public key (from Supabase → Project Settings → API). See the setup guide.">

      <div className="mt-5"><Btn onClick={() => { if (!/^https:\/\/.+\.supabase\.co/.test(url.trim()) || key.trim().length < 20) return alert("Please paste a valid Supabase URL and anon key."); onSave(url.trim(), key.trim()); }}><Save size={15} /> Connect</Btn></div>
    </AuthCard>

function AuthScreen({ supabase }) {
  const [mode, setMode] = useState("in");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true); setMsg("");
    try {
      if (mode === "in") { const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password: pw }); if (error) throw error; }
      else { const { error } = await supabase.auth.signUp({ email: email.trim(), password: pw }); if (error) throw error; setMsg("Account created. If email confirmation is enabled you must confirm via email, then sign in."); setMode("in"); }
    } catch (e) { setMsg(e.message || String(e)); } finally { setBusy(false); }
  };
  return (
    <AuthCard title={mode === "in" ? "Sign in" : "Create account"} sub="Everyone on your team signs in here to share the same data.">
      <div className="space-y-3">
        <Field label="Email"><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} style={inputStyle} className={inputCls} placeholder="you@company.com" autoComplete="username" /></Field>
        <Field label="Password"><input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && go()} style={inputStyle} className={inputCls} placeholder="••••••••" autoComplete={mode === "in" ? "current-password" : "new-password"} /></Field>
      </div>
      {msg && <p className="text-xs mt-3" style={{ color: T.amber }}>{msg}</p>}
      <div className="mt-5"><Btn onClick={go} disabled={busy}>{busy ? <Loader2 size={15} className="animate-spin" /> : <Check size={15} />} {mode === "in" ? "Sign in" : "Create account"}</Btn></div>
      <button onClick={() => { setMode(mode === "in" ? "up" : "in"); setMsg(""); }} className="text-xs mt-4" style={{ color: T.teal }}>
        {mode === "in" ? "No account yet? Create one" : "Already have an account? Sign in"}
      </button>
    </AuthCard>
  );
}
